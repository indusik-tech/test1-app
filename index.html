<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resale Platform</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #0a0a0a;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      color: white;
      font-family: sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .nav-btn.active { color: #facc15; }
    .nav-btn { color: #737373; transition: color 0.2s; }
    
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a0a; z-index: 50; display: none; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s;
    }
    .modal.show { display: flex; transform: translateY(0); }
  </style>
</head>
<body>
  
  <div class="max-w-md mx-auto h-screen relative flex flex-col">
    <!-- Скроллируемая область -->
    <div class="flex-1 overflow-y-auto pb-24 hide-scrollbar" id="main-scroll">
      
      <!-- ВКЛАДКА: ЛЕНТА -->
      <div id="tab-feed" class="tab-content active p-4 space-y-5">
        <div class="flex justify-between items-start mt-2">
          <div>
            <p class="text-sm text-neutral-400">Добрый день, Сандали</p>
            <h1 class="text-2xl font-bold mt-1">Что ищем сегодня?</h1>
          </div>
          <button class="flex items-center gap-1 bg-[#1a1a1c] border border-neutral-800 px-3 py-1.5 rounded-full text-sm">
            <i class="fa-solid fa-location-dot text-yellow-400 text-xs"></i> Уфа
          </button>
        </div>

        <div class="flex gap-2">
          <div class="relative flex-1">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400"></i>
            <input type="text" placeholder="Поиск по 3 327 объявлениям" class="w-full bg-[#1a1a1c] border border-neutral-800 rounded-2xl py-3 pl-9 pr-4 text-sm text-white outline-none focus:border-yellow-400/50">
          </div>
          <button class="bg-yellow-400 text-black px-4 rounded-2xl"><i class="fa-solid fa-sliders"></i></button>
        </div>

        <div class="grid grid-cols-4 gap-2">
          <button onclick="openAddModal()" class="bg-yellow-400 text-black rounded-2xl p-3 flex flex-col items-center justify-center gap-1 aspect-square active:scale-95 transition-transform">
            <i class="fa-solid fa-plus text-lg"></i>
            <span class="text-[11px] font-bold">Продать</span>
          </button>
          <div class="bg-[#1a1a1c] rounded-2xl p-3 flex flex-col items-center justify-center gap-1 aspect-square border border-neutral-800/60">
            <i class="fa-solid fa-calculator text-lg text-neutral-300"></i>
            <span class="text-[11px] text-neutral-300">Оценить</span>
          </div>
          <div class="bg-[#1a1a1c] rounded-2xl p-3 flex flex-col items-center justify-center gap-1 aspect-square border border-neutral-800/60">
            <i class="fa-solid fa-barcode text-lg text-neutral-300"></i>
            <span class="text-[11px] text-neutral-300">Легит</span>
          </div>
          <div class="bg-[#1a1a1c] rounded-2xl p-3 flex flex-col items-center justify-center gap-1 aspect-square border border-neutral-800/60">
            <i class="fa-solid fa-user-shield text-lg text-neutral-300"></i>
            <span class="text-[11px] text-neutral-300">Гарант</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div class="bg-yellow-400 text-black rounded-2xl p-4 flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <i class="fa-solid fa-bolt text-lg"></i>
              <div class="w-5 h-5 bg-black rounded-full flex items-center justify-center"><i class="fa-solid fa-chevron-right text-white text-[10px]"></i></div>
            </div>
            <div>
              <h3 class="font-bold text-base mt-2">Листать новое</h3>
              <p class="text-[11px] opacity-80">46 новых продаж</p>
            </div>
          </div>
          <div class="bg-[#1a1a1c] border border-neutral-800/80 rounded-2xl p-4 flex flex-col justify-between">
            <h3 class="font-bold text-base">Рядом</h3>
            <p class="text-[11px] text-neutral-400">96 в городе</p>
          </div>
        </div>

        <!-- Сетка товаров (Лента) -->
        <div id="feed-items" class="grid grid-cols-2 gap-3"></div>
      </div>

      <!-- ВКЛАДКА: МОИ ЛОТЫ -->
      <div id="tab-mylots" class="tab-content p-4 space-y-4">
        <div class="mt-2">
          <h1 class="text-2xl font-bold">Мои лоты</h1>
          <p class="text-xs text-neutral-400 mt-1" id="mylots-count">2 в канале • 2 лотов всего</p>
        </div>
        <div class="flex gap-2">
          <button class="bg-yellow-400 text-black px-4 py-1.5 rounded-full text-xs font-semibold">Все</button>
          <button class="bg-[#1a1a1c] text-white px-4 py-1.5 rounded-full text-xs font-medium border border-neutral-800">В канале</button>
        </div>
        <div class="bg-[#1a1a1c] border border-neutral-800 rounded-2xl p-3.5 flex gap-3 items-center">
          <div class="bg-neutral-800 p-2 rounded-full"><i class="fa-solid fa-arrow-up text-yellow-400"></i></div>
          <div>
            <h3 class="font-semibold text-xs">Можно поднять лоты</h3>
            <p class="text-[11px] text-neutral-400 mt-0.5">нажмите «Поднять»</p>
          </div>
        </div>
        <div id="mylots-items" class="space-y-3"></div>
      </div>

      <!-- ВКЛАДКА: ПРОФИЛЬ -->
      <div id="tab-profile" class="tab-content">
        <div class="h-44 bg-gradient-to-b from-yellow-500/80 to-[#0a0a0a] relative flex flex-col items-center justify-end pb-4 pt-6">
          <div class="w-20 h-20 rounded-full bg-neutral-800 border-4 border-[#0a0a0a] overflow-hidden mb-2">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400&q=80" class="w-full h-full object-cover">
          </div>
          <h1 class="text-xl font-bold">Сандали</h1>
          <p class="text-xs text-neutral-400 mt-0.5">с октября 2026</p>
        </div>
        <div class="px-4 pb-6 space-y-5">
          <div class="flex flex-wrap justify-center gap-2">
            <div class="bg-[#1a1a1c] border border-neutral-800 px-3 py-1.5 rounded-full text-xs"><span class="text-green-500 font-bold">100%</span> довольны</div>
            <div class="bg-[#1a1a1c] border border-neutral-800 px-3 py-1.5 rounded-full text-xs" id="profile-count">2 лота</div>
          </div>
          <div class="bg-[#1a1a1c] border border-neutral-800/80 rounded-3xl p-2 space-y-1">
            <div class="flex items-center justify-between p-3"><div class="flex gap-3"><i class="fa-solid fa-heart text-neutral-400"></i><span class="text-sm font-medium">Избранное</span></div><i class="fa-solid fa-chevron-right text-neutral-600 text-xs"></i></div>
            <div class="flex items-center justify-between p-3"><div class="flex gap-3"><i class="fa-solid fa-bell text-neutral-400"></i><span class="text-sm font-medium">Подписки</span></div><i class="fa-solid fa-chevron-right text-neutral-600 text-xs"></i></div>
            <div class="flex items-center justify-between p-3"><div class="flex gap-3"><i class="fa-solid fa-store text-neutral-400"></i><span class="text-sm font-medium">Моя витрина</span></div><i class="fa-solid fa-chevron-right text-neutral-600 text-xs"></i></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Навигация -->
    <div class="absolute bottom-0 w-full bg-[#0a0a0a]/95 backdrop-blur-xl border-t border-neutral-900 px-6 py-3 flex justify-between items-center z-40 pb-safe">
      <button onclick="switchTab('feed')" id="btn-feed" class="nav-btn active flex flex-col items-center gap-1"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px]">Лента</span></button>
      <button onclick="switchTab('mylots')" id="btn-mylots" class="nav-btn flex flex-col items-center gap-1"><i class="fa-solid fa-layer-group text-lg"></i><span class="text-[10px]">Мои лоты</span></button>
      <button onclick="switchTab('profile')" id="btn-profile" class="nav-btn flex flex-col items-center gap-1 mr-8"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px]">Профиль</span></button>
      
      <button onclick="openAddModal()" class="absolute right-4 -top-5">
        <div class="bg-yellow-400 text-black w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-yellow-500/20"><i class="fa-solid fa-plus text-xl"></i></div>
      </button>
    </div>

    <!-- Модалка добавления -->
    <div id="add-modal" class="modal">
      <div class="flex items-center justify-between p-4 border-b border-neutral-900">
        <button onclick="closeModals()" class="p-2 text-xl"><i class="fa-solid fa-xmark"></i></button>
        <h2 class="text-base font-bold">Новое объявление</h2>
        <div class="w-8"></div>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <input type="text" id="add-title" placeholder="Название (напр. Nike Dunk)" class="w-full bg-[#1a1a1c] border border-neutral-800 rounded-xl px-3.5 py-3 text-sm text-white outline-none focus:border-yellow-400/50">
        <input type="number" id="add-price" placeholder="Цена (₽)" class="w-full bg-[#1a1a1c] border border-neutral-800 rounded-xl px-3.5 py-3 text-sm text-white outline-none focus:border-yellow-400/50">
        <textarea id="add-desc" placeholder="Описание" rows="3" class="w-full bg-[#1a1a1c] border border-neutral-800 rounded-xl px-3.5 py-3 text-sm text-white outline-none focus:border-yellow-400/50 resize-none"></textarea>
      </div>
      <div class="p-4 border-t border-neutral-900 pb-safe">
        <button onclick="submitItem()" class="w-full bg-yellow-400 text-black py-3.5 rounded-2xl font-bold">Опубликовать</button>
      </div>
    </div>

    <!-- Модалка просмотра товара -->
    <div id="item-modal" class="modal" style="z-index: 60;">
      <div class="relative h-2/5 min-h-[260px] bg-neutral-900">
        <img id="detail-img" src="" class="w-full h-full object-cover">
        <div class="absolute top-0 w-full p-4 flex justify-between bg-gradient-to-b from-black/60 to-transparent">
          <button onclick="closeModals()" class="p-2 bg-black/40 rounded-full"><i class="fa-solid fa-chevron-down"></i></button>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-4 pb-20">
        <h1 id="detail-title" class="text-xl font-bold"></h1>
        <p id="detail-price" class="text-2xl text-yellow-400 font-extrabold mt-1"></p>
        <p id="detail-desc" class="text-neutral-300 text-sm mt-4"></p>
      </div>
      <div class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-[#0a0a0a] to-transparent pb-safe">
        <button onclick="closeModals()" class="w-full bg-yellow-400 text-black py-3.5 rounded-2xl font-bold">Закрыть</button>
      </div>
    </div>

  </div>

  <script>
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let items = [
      { id: 1, title: 'Nike Dunk Low', price: 12500, desc: 'Оригинал, 9/10', isMine: false, img: 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400&q=80' },
      { id: 2, title: 'Yeezy Boost 350', price: 22000, desc: 'Новые с бирками', isMine: true, img: 'https://images.unsplash.com/photo-1615714316900-51743f55447b?w=400&q=80' },
      { id: 3, title: 'Jordan 1 Retro', price: 18500, desc: 'Отличное состояние', isMine: true, img: 'https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?w=400&q=80' }
    ];

    function renderFeed() {
      const container = document.getElementById('feed-items');
      container.innerHTML = items.map(item => `
        <div onclick="openItem(${item.id})" class="bg-[#1a1a1c] border border-neutral-900 rounded-2xl overflow-hidden cursor-pointer">
          <div class="aspect-[4/5]"><img src="${item.img}" class="w-full h-full object-cover"></div>
          <div class="p-3">
            <p class="text-yellow-400 font-bold">${item.price.toLocaleString()} ₽</p>
            <p class="text-xs mt-1 truncate">${item.title}</p>
          </div>
        </div>`).join('');
    }

    function renderMyLots() {
      const myItems = items.filter(i => i.isMine);
      document.getElementById('mylots-count').innerText = `${myItems.length} в канале • ${myItems.length} всего`;
      document.getElementById('profile-count').innerText = `${myItems.length} лота`;
      
      const container = document.getElementById('mylots-items');
      container.innerHTML = myItems.map(item => `
        <div onclick="openItem(${item.id})" class="bg-[#1a1a1c] border border-neutral-800 rounded-2xl p-4 flex flex-col gap-3">
          <h3 class="font-medium text-sm text-white">${item.title}</h3>
          <p class="text-yellow-400 font-bold">${item.price.toLocaleString()} ₽</p>
        </div>`).join('');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('btn-' + tabId).classList.add('active');
    }

    function openAddModal() { document.getElementById('add-modal').classList.add('show'); }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); }

    function openItem(id) {
      const item = items.find(i => i.id === id);
      document.getElementById('detail-img').src = item.img;
      document.getElementById('detail-title').innerText = item.title;
      document.getElementById('detail-price').innerText = item.price.toLocaleString() + ' ₽';
      document.getElementById('detail-desc').innerText = item.desc;
      document.getElementById('item-modal').classList.add('show');
    }

    function submitItem() {
      const title = document.getElementById('add-title').value;
      const price = document.getElementById('add-price').value;
      if(!title || !price) return;
      
      items.unshift({
        id: Date.now(), title, price: parseInt(price), desc: document.getElementById('add-desc').value,
        isMine: true, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80'
      });
      
      document.getElementById('add-title').value = '';
      document.getElementById('add-price').value = '';
      
      renderFeed();
      renderMyLots();
      closeModals();
    }

    renderFeed();
    renderMyLots();
  </script>
</body>
</html>
