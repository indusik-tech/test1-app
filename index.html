<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resale Platform</title>
  <!-- Telegram Web App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Babel для парсинга JSX на лету -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #0a0a0a;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Home, Layers, User, Plus, Search, MapPin, Heart, Eye, ArrowUp, 
      ChevronRight, Calculator, ScanBarcode, UserCheck, Zap, X, Camera, 
      MessageCircle, Settings, Bell, LayoutGrid, Palette 
    } from 'https://esm.sh/lucide-react@0.363.0';

    const initialItems = [
      {
        id: 1,
        title: 'Nike Dunk Low Retro White Black',
        price: 12500,
        location: 'Москва',
        time: '12 мин',
        views: 342,
        isMine: false,
        image: 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400&q=80',
        description: 'Оригинал, любые проверки. Состояние 9/10, носились пару раз. Коробка в комплекте.'
      },
      {
        id: 2,
        title: 'Yeezy Boost 350 V2 Bone',
        price: 22000,
        location: 'Уфа',
        time: '21 мин',
        views: 154,
        isMine: true,
        image: 'https://images.unsplash.com/photo-1615714316900-51743f55447b?w=400&q=80',
        description: 'Новые с бирками (DS). Не подошел размер. Покупал на Poizon.'
      },
      {
        id: 3,
        title: 'Carhartt WIP Detroit Jacket',
        price: 15000,
        location: 'Санкт-Петербург',
        time: '1 час',
        views: 89,
        isMine: false,
        image: 'https://images.unsplash.com/photo-1559551409-dadc959f76b8?w=400&q=80',
        description: 'Винтажная куртка, отличный фейд. Размер L. Без дефектов.'
      },
      {
        id: 4,
        title: 'Jordan 1 Retro High OG',
        price: 18500,
        location: 'Казань',
        time: '3 часа',
        views: 420,
        isMine: true,
        image: 'https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?w=400&q=80',
        description: 'Состояние хорошее, есть небольшие заломы. Полный комплект.'
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('feed');
      const [items, setItems] = useState(initialItems);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [isChatOpen, setIsChatOpen] = useState(false);

      useEffect(() => {
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      }, []);

      const handleAddItem = (newItem) => {
        setItems([{ ...newItem, id: Date.now(), isMine: true, views: 0, time: 'только что' }, ...items]);
        setIsAddModalOpen(false);
      };

      return (
        <div className="max-w-md mx-auto h-screen bg-[#0a0a0a] text-white relative overflow-hidden flex flex-col font-sans">
          <div className="flex-1 overflow-y-auto pb-24 hide-scrollbar">
            {activeTab === 'feed' && <FeedView items={items} onOpenItem={setSelectedItem} onOpenAdd={() => setIsAddModalOpen(true)} />}
            {activeTab === 'mylots' && <MyLotsView items={items.filter(i => i.isMine)} onOpenItem={setSelectedItem} />}
            {activeTab === 'profile' && <ProfileView mineCount={items.filter(i => i.isMine).length} />}
          </div>

          <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} onOpenAdd={() => setIsAddModalOpen(true)} />

          {isAddModalOpen && <AddItemModal onClose={() => setIsAddModalOpen(false)} onAdd={handleAddItem} />}
          
          {selectedItem && (
            <ItemDetailModal 
              item={selectedItem} 
              onClose={() => setSelectedItem(null)} 
              onChat={() => setIsChatOpen(true)} 
            />
          )}

          {isChatOpen && (
            <div className="absolute inset-0 z-50 bg-[#0a0a0a] flex flex-col justify-center items-center p-6 text-center">
              <MessageCircle className="w-16 h-16 text-yellow-400 mb-4" />
              <h2 className="text-2xl font-bold mb-2">Чат с продавцом</h2>
              <p className="text-neutral-400 mb-8">Функция диалога находится в разработке.</p>
              <button 
                onClick={() => setIsChatOpen(false)}
                className="w-full bg-neutral-800 py-3 rounded-2xl font-medium"
              >
                Вернуться
              </button>
            </div>
          )}
        </div>
      );
    }

    function FeedView({ items, onOpenItem, onOpenAdd }) {
      return (
        <div className="p-4 space-y-5">
          <div className="flex justify-between items-start mt-2">
            <div>
              <p className="text-sm text-neutral-400">Добрый день, Сандали</p>
              <h1 className="text-2xl font-bold mt-1">Что ищем сегодня?</h1>
            </div>
            <button className="flex items-center gap-1 bg-[#1a1a1c] border border-neutral-800 px-3 py-1.5 rounded-full text-sm">
              <MapPin className="w-4 h-4 text-yellow-400" /> Уфа
            </button>
          </div>

          <div className="flex gap-2">
            <div className="relative flex-1">
              <Search className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400" />
              <input 
                type="text" 
                placeholder="Поиск по 3 327 объявлениям" 
                className="w-full bg-[#1a1a1c] border border-neutral-800 rounded-2xl py-3 pl-10 pr-4 text-sm focus:outline-none"
              />
            </div>
            <button className="bg-yellow-400 text-black p-3 rounded-2xl">
              <Settings className="w-5 h-5" />
            </button>
          </div>

          <div className="grid grid-cols-4 gap-2">
            <button onClick={onOpenAdd} className="bg-yellow-400 text-black rounded-2xl p-3 flex flex-col items-center justify-center gap-1 aspect-square">
              <Plus className="w-6 h-6" />
              <span className="text-[11px] font-bold">Продать</span>
            </button>
            <button className="bg-[#1a1a1c] rounded-2xl p-3 flex flex-col items-center justify-center gap-1 aspect-square border border-neutral-800/60">
              <Calculator className="w-6 h-6 text-neutral-300" />
              <span className="text-[11px] text-neutral-300">Оценить</span>
            </button>
            <button className="bg-[#1a1a1c] rounded-2xl p-3 flex flex-col items-center justify-center gap-1 aspect-square border border-neutral-800/60">
              <ScanBarcode className="w-6 h-6 text-neutral-300" />
              <span className="text-[11px] text-neutral-300">Легит</span>
            </button>
            <button className="bg-[#1a1a1c] rounded-2xl p-3 flex flex-col items-center justify-center gap-1 aspect-square border border-neutral-800/60">
              <UserCheck className="w-6 h-6 text-neutral-300" />
              <span className="text-[11px] text-neutral-300">Гарант</span>
