<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resale Platform</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0a0a; --card: #1a1a1c; --border: #262626;
      --accent: #ffffff; --text: #ffffff; --muted: #a3a3a3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: "MiSans", "Mi Lanting", system-ui, -apple-system, sans-serif; 
      font-weight: 500; -webkit-tap-highlight-color: transparent;
      user-select: none; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .hide-scrollbar { overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    .tab-content { display: none; padding: 16px; padding-bottom: 90px; }
    .text-accent { color: var(--accent); }
    .bg-card { background-color: var(--card); border: 1px solid var(--border); }
    .nav-bar {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background-color: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 12px 24px; z-index: 40;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 600; cursor: pointer;
    }
    .fab-btn {
      position: absolute; left: 50%; transform: translateX(-50%); top: -24px; width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #000; border: none; font-size: 24px; display: flex;
      align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 50; display: none; flex-direction: column;
    }
    .modal-header { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); align-items: center;}
    .input-field {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; outline: none; font-family: inherit; font-weight: 500;
    }
    .btn-primary {
      width: 100%; background: var(--accent); color: #000; border: none;
      padding: 16px; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer;}
  </style>
</head>
<body>

  <div class="hide-scrollbar" style="flex: 1;" id="main-scroll">
    <div id="tab-feed" class="tab-content" style="display: block;">
      <div style="margin-bottom: 20px;">
        <p style="color: var(--muted); font-size: 14px;" id="welcome-text"></p>
        <h1 style="font-size: 24px; font-weight: bold; margin-top: 4px;">Что ищем сегодня?</h1>
      </div>
      <input type="text" placeholder="Поиск..." class="input-field" style="margin-bottom: 20px;" id="search-input" oninput="renderFeed()">
      <div id="feed-items" class="grid-2"></div>
    </div>

    <div id="tab-profile" class="tab-content">
      <div style="text-align: center; padding-top: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);">
        <div style="width: 80px; height: 80px; background: #262626; border-radius: 50%; margin: 0 auto 12px; overflow: hidden;">
          <img id="profile-avatar" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400&q=80" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <h1 id="profile-name" style="font-size: 20px; font-weight: bold;">Пользователь</h1>
        <p id="admin-badge" style="color: #ef4444; font-size: 12px; font-weight: bold; display: none; margin-top: 4px;">👑 АДМИН</p>
      </div>

      <div id="admin-panel" style="display:none; margin-top: 20px; padding: 16px; background: #1a0000; border: 1px solid #ef4444; border-radius: 16px;">
        <h2 style="font-size: 16px; font-weight: bold; color: #ef4444; margin-bottom: 12px;">Новые отзывы (<span id="admin-reviews-count">0</span>)</h2>
        <div id="admin-reviews-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <h2 style="font-size: 18px; font-weight: bold; margin-top: 20px; margin-bottom: 12px;">Мои лоты (<span id="mylots-count">0</span>)</h2>
      <div id="mylots-items" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>
  </div>

  <div class="nav-bar pb-safe">
    <button class="nav-btn" id="btn-feed" onclick="switchTab('feed')" style="flex: 1; color: var(--accent);">
      <div style="font-size: 20px;">🏠</div> Лента
    </button>
    <div style="flex: 1; position: relative;">
      <button class="fab-btn" onclick="openModal('add-modal')">➕</button>
    </div>
    <button class="nav-btn" id="btn-profile" onclick="switchTab('profile')" style="flex: 1; color: var(--muted);">
      <div style="font-size: 20px;">👤</div> Профиль
    </button>
  </div>

  <div id="add-modal" class="modal">
    <div class="modal-header">
      <button onclick="closeModals()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
      <h2 id="modal-form-title" style="font-size: 16px; font-weight: bold;">Объявление</h2>
      <div style="width: 20px;"></div>
    </div>
    <div style="flex: 1; padding: 16px; overflow-y:auto;">
      <input type="hidden" id="edit-id" value="">
      
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">Фотографии (до 10 шт):</p>
      <div id="image-previews" style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 8px;"></div>
      <button onclick="document.getElementById('add-image-file').click()" class="btn-primary" style="background: #262626; color: white; margin-bottom: 12px; padding: 12px;">+ Выбрать фото</button>
      <input type="file" id="add-image-file" accept="image/*" multiple style="display:none;" onchange="handleFiles(this)">
      
      <input type="text" id="add-title" class="input-field" placeholder="Название вещи">
      <input type="number" id="add-price" class="input-field" placeholder="Цена (₽)">
      <input type="text" id="add-location" class="input-field" placeholder="Город">
      <textarea id="add-desc" class="input-field" placeholder="Описание..." rows="4"></textarea>
    </div>
    <div style="padding: 16px;" class="pb-safe">
      <button class="btn-primary" onclick="saveItem()" id="save-btn">Опубликовать</button>
    </div>
  </div>

  <div id="item-modal" class="modal" style="z-index: 60;">
    <div style="position: relative; height: 45%; background: #262626;">
      <div id="detail-img-container" style="display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 100%; width: 100%;"></div>
      <button onclick="closeModals()" style="position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.5); border:none; color:white; border-radius:50%; width:32px; height:32px; font-size:16px;">✕</button>
    </div>
    <div style="flex: 1; padding: 16px; overflow-y: auto;">
      <h1 id="detail-title" style="font-size: 20px; font-weight: bold;"></h1>
      <p id="detail-price" class="text-accent font-bold" style="font-size: 24px; margin-top: 4px;"></p>
      <div style="display:flex; justify-content: space-between; margin-top: 12px; color: var(--muted); font-size: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);">
        <span id="detail-location"></span>
        <span id="detail-seller"></span>
      </div>
      <p id="detail-rating" style="font-size: 14px; margin-top: 12px; color: #facc15; font-weight: bold;"></p>
      <p id="detail-desc" style="color: var(--muted); font-size: 14px; margin-top: 12px; line-height: 1.5;"></p>
    </div>
    <div class="pb-safe" style="padding: 16px; background: var(--bg);" id="detail-action-container"></div>
  </div>

  <div id="review-modal" class="modal" style="z-index: 70;">
    <div class="modal-header">
      <button onclick="closeReviewModal()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
      <h2 style="font-size: 16px; font-weight: bold;">Оставить отзыв</h2>
      <div style="width: 20px;"></div>
    </div>
    <div style="flex: 1; padding: 16px;">
      <input type="hidden" id="review-target-id">
      <select id="review-rating" class="input-field" style="height: 50px;">
        <option value="5">⭐⭐⭐⭐⭐ (Отлично)</option>
        <option value="4">⭐⭐⭐⭐ (Хорошо)</option>
        <option value="3">⭐⭐⭐ (Нормально)</option>
        <option value="2">⭐⭐ (Плохо)</option>
        <option value="1">⭐ (Ужасно)</option>
      </select>
      <textarea id="review-comment" class="input-field" placeholder="Текст отзыва..." rows="4"></textarea>
    </div>
    <div style="padding: 16px;" class="pb-safe">
      <button class="btn-primary" onclick="submitReview()">Отправить</button>
    </div>
  </div>

  <script>
    var MY_ADMIN_ID = 1879880417;
    var SUPABASE_URL = 'https://qlomefucenvjktwacwow.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_cIsEZCsfm19S9mnS2YYorA_4mpyVYyp';

    var tgUser = { id: 1879880417, first_name: "Админ", username: "", photo_url: "" }; 
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        window.Telegram.WebApp.setHeaderColor('#0a0a0a');
        if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
          tgUser = window.Telegram.WebApp.initDataUnsafe.user;
        }
      }
    } catch(e) {}

    var IS_ADMIN = (Number(tgUser.id) === MY_ADMIN_ID);
    document.getElementById('welcome-text').innerText = 'Добрый день, ' + tgUser.first_name + '!';
    document.getElementById('profile-name').innerText = tgUser.first_name;
    if (tgUser.photo_url) { document.getElementById('profile-avatar').src = tgUser.photo_url; }
    if (IS_ADMIN) { 
      document.getElementById('admin-badge').style.display = 'block';
      document.getElementById('admin-panel').style.display = 'block';
    }

    var items = []; 
    var reviews = [];
    var currentImages = []; 

    function parseImages(imgStr) {
      if (!imgStr) return [];
      try {
        var p = JSON.parse(imgStr);
        if (Array.isArray(p)) return p;
        return [imgStr];
      } catch(e) { return [imgStr]; }
    }

    function dbQuery(table, method, body, eqCol, eqVal) {
      var url = SUPABASE_URL + '/rest/v1/' + table;
      if (eqCol && eqVal) url += '?' + eqCol + '=eq.' + eqVal;
      else if (method === 'GET') url += '?order=created_at.desc';
      
      var options = {
        method: method,
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        }
      };
      if (body) options.body = JSON.stringify(body);
      
      return fetch(url, options).then(function(res) { return res.json(); });
    }

    function fetchData() {
      dbQuery('items', 'GET').then(function(data) {
        if(Array.isArray(data)) { items = data; renderFeed(); renderMyLots(); }
      }).catch(function(e){});
      
      dbQuery('reviews', 'GET').then(function(data) {
        if(Array.isArray(data)) { reviews = data; renderAdminReviews(); }
      }).catch(function(e){});
    }

    function renderFeed() {
      var q = document.getElementById('search-input').value.toLowerCase();
      var html = '';
      for(var i=0; i<items.length; i++) {
        var item = items[i];
        if (q && item.title.toLowerCase().indexOf(q) === -1) continue;
        var imgs = parseImages(item.image);
        var imgUrl = imgs.length > 0 ? imgs[0] : 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80';
        html += '<div class="item-card" onclick="openItem(' + item.id + ')">' +
                  '<div style="width:100%; aspect-ratio:4/5; background:#262626;">' +
                    '<img src="' + imgUrl + '" style="width:100%; height:100%; object-fit:cover;">' +
                  '</div>' +
                  '<div style="padding: 12px;">' +
                    '<p class="text-accent font-bold">' + item.price.toLocaleString() + ' ₽</p>' +
                    '<p style="font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">' + item.title + '</p>' +
                  '</div>' +
                '</div>';
      }
      document.getElementById('feed-items').innerHTML = html;
    }

    function renderMyLots() {
      var count = 0; var html = '';
      for(var i=0; i<items.length; i++) {
        if(Number(items[i].user_id) === Number(tgUser.id)) {
          count++;
          var item = items[i];
          html += '<div class="bg-card" style="border-radius:16px; padding:16px; cursor:pointer;" onclick="openItem(' + item.id + ')">' +
                    '<h3 style="font-size: 14px; font-weight: 500;">' + item.title + '</h3>' +
                    '<p class="text-accent font-bold" style="font-size: 18px; margin-top:4px;">' + item.price.toLocaleString() + ' ₽</p>' +
                  '</div>';
        }
      }
      document.getElementById('mylots-count').innerText = count;
      document.getElementById('mylots-items').innerHTML = html;
    }

    window.handleFiles = function(input) {
      var files = input.files;
      if (!files) return;
      var fArr = Array.prototype.slice.call(files);
      fArr.forEach(function(file) {
        if(currentImages.length >= 10) return;
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            var maxW = 500; var maxH = 500;
            var w = img.width; var h = img.height;
            if (w > h && w > maxW) { h = h * (maxW / w); w = maxW; }
            else if (h > maxH) { w = w * (maxH / h); h = maxH; }
            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            currentImages.push(canvas.toDataURL('image/jpeg', 0.6));
            renderImagePreviews();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      input.value = ''; 
    };

    window.removeImage = function(index) {
      currentImages.splice(index, 1);
      renderImagePreviews();
    };

    function renderImagePreviews() {
      var html = '';
      for(var i=0; i<currentImages.length; i++) {
        html += '<div style="position:relative; width:80px; height:80px; flex-shrink:0; border:1px solid #262626; border-radius:8px; overflow:hidden;">' +
                  '<img src="' + currentImages[i] + '" style="width:100%; height:100%; object-fit:cover;">' +
                  '<div onclick="removeImage(' + i + ')" style="position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.8); color:white; width:24px; height:24px; border-radius:12px; text-align:center; line-height:24px; font-size:12px; cursor:pointer;">✕</div>' +
                '</div>';
      }
      document.getElementById('image-previews').innerHTML = html;
    }

    window.saveItem = function() {
      var id = document.getElementById('edit-id').value;
      var title = document.getElementById('add-title').value;
      var price = document.getElementById('add-price').value;
      var desc = document.getElementById('add-desc').value;
      var loc = document.getElementById('add-location').value;
      
      if (!title || !price) return;
      document.getElementById('save-btn').innerText = 'Сохранение...';
      
      var uName = tgUser.first_name + (tgUser.username ? ' (@' + tgUser.username + ')' : '');
      var itemData = {
        user_id: tgUser.id, user_name: uName, title: title, price: parseInt(price),
        description: desc, location: loc || 'Уфа', image: JSON.stringify(currentImages), status: 'active'
      };

      if (id) {
        dbQuery('items', 'PATCH', itemData, 'id', id).then(function() { closeModals(); fetchData(); });
      } else {
        dbQuery('items', 'POST', itemData).then(function() { closeModals(); fetchData(); });
      }
    };

    window.deleteItem = function(id) {
      if (confirm("Удалить объявление?")) {
        closeModals(); dbQuery('items', 'DELETE', null, 'id', id).then(function() { fetchData(); });
      }
    };

    window.startEdit = function(id) {
      var item = null;
      for(var i=0; i<items.length; i++) { if(items[i].id === id) item = items[i]; }
      if(!item) return;
      document.getElementById('modal-form-title').innerText = 'Редактировать лот';
      document.getElementById('edit-id').value = item.id;
      document.getElementById('add-title').value = item.title;
      document.getElementById('add-price').value = item.price;
      document.getElementById('add-desc').value = item.description || '';
      document.getElementById('add-location').value = item.location || '';
      currentImages = parseImages(item.image);
      renderImagePreviews();
      document.getElementById('save-btn').innerText = 'Сохранить';
      openModal('add-modal');
    };

    window.contactSeller = function(id) {
      var item = null;
      for(var i=0; i<items.length; i++) { if(items[i].id === id) item = items[i]; }
      if(!item) return;
      var match = (item.user_name || '').match(/@(\w+)/);
      if (match && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
        window.Telegram.WebApp.openTelegramLink("https://t.me/" + match[1]);
      } else { alert("Продавец без @username: " + (item.user_name || "Неизвестно")); }
    };

    window.openReviewModal = function(sellerId) {
      document.getElementById('review-target-id').value = sellerId;
      document.getElementById('review-comment').value = '';
      document.getElementById('review-modal').style.display = 'flex';
    };

    window.closeReviewModal = function() {
      document.getElementById('review-modal').style.display = 'none';
    };

    window.submitReview = function() {
      var sellerId = document.getElementById('review-target-id').value;
      var rating = document.getElementById('review-rating').value;
      var comment = document.getElementById('review-comment').value;
      if (!comment) return;
      
      var revData = {
        seller_id: parseInt(sellerId), reviewer_name: tgUser.first_name, rating: parseInt(rating), comment: comment, status: 'pending'
      };
      
      dbQuery('reviews', 'POST', revData).then(function(){
        closeReviewModal();
        if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.showAlert) {
          window.Telegram.WebApp.showAlert('Отзыв отправлен на модерацию!');
        } else {
          alert('Отзыв отправлен на модерацию!');
        }
      });
    };

    function renderAdminReviews() {
      if (!IS_ADMIN) return;
      var pReviews = [];
      for(var i=0; i<reviews.length; i++) { if(reviews[i].status === 'pending') pReviews.push(reviews[i]); }
      document.getElementById('admin-reviews-count').innerText = pReviews.length;
      var html = '';
      for(var j=0; j<pReviews.length; j++) {
        var r = pReviews[j];
        html += '<div style="background: #262626; padding: 12px; border-radius: 8px;">' +
                  '<p style="f
