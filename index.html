<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resale Platform</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #0a0a0a; --card: #1a1a1c; --border: #262626;
      --accent: #ffffff;
      --text: #ffffff; --muted: #a3a3a3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: sans-serif; -webkit-tap-highlight-color: transparent;
      user-select: none; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .hide-scrollbar { overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    
    .tab-content { display: none; padding: 16px; padding-bottom: 90px; }
    .tab-content.active { display: block; }
    
    .text-accent { color: var(--accent); }
    .bg-card { background-color: var(--card); border: 1px solid var(--border); }
    
    .nav-bar {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background-color: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 12px 24px; z-index: 40;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 500; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }
    .fab-btn {
      position: absolute; left: 50%; transform: translateX(-50%); top: -24px; width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #000; border: none; font-size: 24px; display: flex;
      align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 50; display: none; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s ease;
    }
    .modal.show { display: flex; transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); align-items: center;}
    .input-field {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; outline: none;
    }
    .btn-primary {
      width: 100%; background: var(--accent); color: #000; border: none;
      padding: 16px; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer;}
  </style>
</head>
<body>

  <div class="hide-scrollbar" style="flex: 1;" id="main-scroll">
    
    <div id="tab-feed" class="tab-content active">
      <div style="margin-bottom: 20px;">
        <p style="color: var(--muted); font-size: 14px;" id="welcome-text">Добрый день!</p>
        <h1 style="font-size: 24px; font-weight: bold; margin-top: 4px;">Что ищем сегодня?</h1>
      </div>
      <input type="text" id="search-input" placeholder="Поиск по объявлениям..." class="input-field" style="margin-bottom: 20px;" oninput="renderFeed()">
      <div id="feed-items" class="grid-2"></div>
    </div>

    <div id="tab-profile" class="tab-content">
      <div style="text-align: center; padding-top: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);">
        <div style="width: 80px; height: 80px; background: #262626; border-radius: 50%; margin: 0 auto 12px; overflow: hidden;">
          <img id="profile-avatar" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400&q=80" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <h1 id="profile-name" style="font-size: 20px; font-weight: bold;">Пользователь</h1>
        <p id="admin-badge" style="color: #ef4444; font-size: 12px; font-weight: bold; display: none; margin-top: 4px;">👑 АДМИНИСТРАТОР</p>
      </div>

      <div id="admin-panel" style="display: none; margin-top: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px;">
        <h3 style="font-size: 16px; font-weight: bold; margin-bottom: 12px;">Модерация отзывов (<span id="pending-count">0</span>)</h3>
        <div id="admin-reviews-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
      
      <h2 style="font-size: 18px; font-weight: bold; margin-top: 20px; margin-bottom: 12px;">Выложенные лоты (<span id="mylots-count">0</span>)</h2>
      <div id="mylots-items" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>
  </div>

  <div class="nav-bar pb-safe">
    <button class="nav-btn active" id="btn-feed" onclick="switchTab('feed')" style="flex: 1;">
      <div style="font-size: 20px;">🏠</div> Лента
    </button>
    
    <div style="flex: 1; position: relative;">
      <button class="fab-btn" onclick="openModal('add-modal')">➕</button>
    </div>

    <button class="nav-btn" id="btn-profile" onclick="switchTab('profile')" style="flex: 1;">
      <div style="font-size: 20px;">👤</div> Профиль
    </button>
  </div>

  <div id="add-modal" class="modal">
    <div class="modal-header">
      <button onclick="closeModals()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
      <h2 id="modal-form-title" style="font-size: 16px; font-weight: bold;">Новое объявление</h2>
      <div style="width: 20px;"></div>
    </div>
    <div style="flex: 1; padding: 16px; overflow-y:auto;">
      <input type="hidden" id="edit-id" value="">
      
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 4px;">Фотография (Из галереи):</p>
      <input type="file" id="add-image-file" accept="image/*" class="input-field" style="padding: 10px;">
      <img id="add-image-preview" src="" style="display:none; width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border);">

      <input type="text" id="add-title" class="input-field" placeholder="Название вещи">
      <input type="number" id="add-price" class="input-field" placeholder="Цена (₽)">
      <input type="text" id="add-location" class="input-field" placeholder="Город">
      <textarea id="add-desc" class="input-field" placeholder="Описание, состояние, размер..." rows="4"></textarea>
    </div>
    <div style="padding: 16px;" class="pb-safe">
      <button class="btn-primary" onclick="saveItem()" id="save-btn">Опубликовать</button>
    </div>
  </div>

  <div id="item-modal" class="modal" style="z-index: 60;">
    <div style="position: relative; height: 45%; background: #262626;">
      <img id="detail-img" src="" style="width: 100%; height: 100%; object-fit: cover;">
      <button onclick="closeModals()" style="position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.5); border:none; color:white; border-radius:50%; width:32px; height:32px; font-size:16px;">✕</button>
    </div>
    <div style="flex: 1; padding: 16px; overflow-y: auto;">
      <h1 id="detail-title" style="font-size: 20px; font-weight: bold;"></h1>
      <p id="detail-price" class="text-accent font-bold" style="font-size: 24px; margin-top: 4px;"></p>
      <p id="detail-rating" style="font-size: 14px; margin-top: 6px; color: #facc15; font-weight: bold;"></p>
      
      <div style="display:flex; justify-content: space-between; margin-top: 12px; color: var(--muted); font-size: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);">
        <span id="detail-location">📍 Город</span>
        <span id="detail-seller">👤 Продавец</span>
      </div>
      <p id="detail-desc" style="color: var(--muted); font-size: 14px; margin-top: 16px; line-height: 1.5;"></p>
    </div>
    <div class="pb-safe" style="padding: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 8px;" id="detail-action-container">
    </div>
  </div>

  <div id="review-modal" class="modal" style="z-index: 70;">
    <div class="modal-header">
      <button onclick="document.getElementById('review-modal').classList.remove('show')" style="background:none; border:none; color:white; font-size:20px;">✕</button>
      <h2 style="font-size: 16px; font-weight: bold;">Оставить отзыв</h2>
      <div style="width: 20px;"></div>
    </div>
    <div style="flex: 1; padding: 16px; overflow-y: auto;">
      <input type="hidden" id="review-seller-id">
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 4px;">Оценка от 1 до 5 звезд:</p>
      <select id="review-stars" class="input-field">
        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
        <option value="4">⭐⭐⭐⭐ (4)</option>
        <option value="3">⭐⭐⭐ (3)</option>
        <option value="2">⭐⭐ (2)</option>
        <option value="1">⭐ (1)</option>
      </select>
      <textarea id="review-text" class="input-field" placeholder="Ваш отзыв..." rows="4"></textarea>
    </div>
    <div style="padding: 16px;" class="pb-safe">
      <button class="btn-primary" onclick="submitReview()">Отправить на модерацию</button>
    </div>
  </div>

  <script>
    var MY_ADMIN_ID = 1879880417; 
    var SUPABASE_URL = 'https://qlomefucenvjktwacwow.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_cIsEZCsfm19S9mnS2YYorA_4mpyVYyp';
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var tgUser = { id: 1879880417, first_name: "Админ", username: "admin", photo_url: "" }; 
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor('#0a0a0a');
      if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        tgUser = window.Telegram.WebApp.initDataUnsafe.user;
      }
    }

    var IS_ADMIN = (Number(tgUser.id) === MY_ADMIN_ID);

    document.getElementById('welcome-text').innerText = 'Добрый день, ' + tgUser.first_name + '!';
    document.getElementById('profile-name').innerText = tgUser.first_name;
    if (tgUser.photo_url) { document.getElementById('profile-avatar').src = tgUser.photo_url; }
    if (IS_ADMIN) { 
      document.getElementById('admin-badge').style.display = 'block';
      document.getElementById('admin-panel').style.display = 'block';
    }

    var items = []; 
    var reviews = [];
    var currentBase64Image = ''; 
    var currentSelectedItem = null;

    function fetchAllData() {
      supabase.from('items').select('*').order('created_at', { ascending: false }).then(function(res) {
        if (!res.error) {
          items = res.data || [];
          renderFeed();
          renderMyLots();
        }
      });
      supabase.from('reviews').select('*').then(function(res) {
        if (!res.error) {
          reviews = res.data || [];
          if (IS_ADMIN) renderAdminReviews();
        }
      });
    }

    function renderFeed() {
      var query = document.getElementById('search-input').value.toLowerCase();
      var html = '';
      for(var i=0; i<items.length; i++) {
        var item = items[i];
        if (query && item.title.toLowerCase().indexOf(query) === -1) continue;
        var imgUrl = item.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80';
        html += '<div class="item-card" onclick="openItem(' + item.id + ')">' +
                  '<div style="width:100%; aspect-ratio:4/5; background:#262626;">' +
                    '<img src="' + imgUrl + '" style="width:100%; height:100%; object-fit:cover;">' +
                  '</div>' +
                  '<div style="padding: 12px;">' +
                    '<p class="text-accent font-bold">' + item.price.toLocaleString() + ' ₽</p>' +
                    '<p style="font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">' + item.title + '</p>' +
                    '<p style="font-size: 10px; color: var(--muted); margin-top: 4px;">📍 ' + (item.location || 'Уфа') + '</p>' +
                  '</div>' +
                '</div>';
      }
      document.getElementById('feed-items').innerHTML = html;
    }

    function renderMyLots() {
      var myItems = [];
      for(var i=0; i<items.length; i++) {
        if(Number(items[i].user_id) === Number(tgUser.id)) {
          myItems.push(items[i]);
        }
      }
      
      document.getElementById('mylots-count').innerText = myItems.length;
      
      var html = '';
      for(var j=0; j<myItems.length; j++) {
        var item = myItems[j];
        html += '<div class="bg-card" style="border-radius:16px; padding:16px; cursor:pointer;" onclick="openItem(' + item.id + ')">' +
                  '<h3 style="font-size: 14px; font-weight: 500;">' + item.title + '</h3>' +
                  '<p class="text-accent font-bold" style="font-size: 18px; margin-top:4px;">' + item.price.toLocaleString() + ' ₽</p>' +
                '</div>';
      }
      if(myItems.length === 0) {
        html = '<p style="color: var(--muted); font-size: 14px; text-align: center; margin-top: 20px;">У вас пока нет объявлений.</p>';
      }
      document.getElementById('mylots-items').innerHTML = html;
    }

    function renderAdminReviews() {
      var pending = [];
      for(var i=0; i<reviews.length; i++) {
        if(reviews[i].status === 'pending') pending.push(reviews[i]);
      }
      document.getElementById('pending-count').innerText = pending.length;
      var html = '';
      for(var j=0; j<pending.length; j++) {
        var rev = pending[j];
        html += '<div style="background: #262626; padding: 12px; border-radius: 10px;">' +
                  '<p style="font-size: 12px; color: var(--muted);">Продавец ID: ' + rev.seller_id + '</p>' +
                  '<p style="font-size: 14px; font-weight: bold; margin: 4px 0;">⭐ ' + rev.rating + '/5 от ' + rev.reviewer_name + '</p>' +
                  '<p style="font-size: 13px; margin-bottom: 8px;">' + rev.comment + '</p>' +
                  '<div style="display: flex; gap: 8px;">' +
                    '<button onclick="moderateReview(' + rev.id + ', \'active\')" style="flex:1; background:white; color:black; border:none; padding:8px; border-radius:8px; font-weight:bold; font-size:12px;">Одобрить</button>' +
                    '<button onclick="moderateReview(' + rev.id + ', \'rejected\')" style="flex:1; background:#ef4444; color:white; border:none; padding:8px; border-radius:8px; font-weight:bold; font-size:12px;">Отклонить</button>' +
                  '</div>' +
                '</div>';
      }
      if(pending.length === 0) {
        html = '<p style="font-size: 13px; color: var(--muted);">Нет новых отзывов на проверку.</p>';
      }
      document.getElementById('admin-reviews-list').innerHTML = html;
    }

    function moderateReview(id, status) {
      if(status === 'rejected') {
        supabase.from('reviews').delete().eq('id', id).then(function() { fetchAllData(); });
      } else {
        supabase.from('reviews').update({ status: 'active' }).eq('id', id).then(function() { fetchAllData(); });
      }
    }

    function calculateRating(sellerId) {
      var count = 0;
      var sum = 0;
      for(var i=0; i<reviews.length; i++) {
        if(Number(reviews[i].seller_id) === Number(sellerId) && reviews[i].status === 'active') {
          count++;
          sum += Number(reviews[i].rating);
        }
      }
      if(count === 0) return 'Нет отзывов (0)';
      var avg = (sum / count).toFixed(1);
      return '⭐ ' + avg + ' (' + count + ' отзывов)';
    }

    document.getElementById('add-image-file').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(event) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var maxW = 800; var maxH = 800;
          var w = img.width; var h = img.height;
          if (w > h && w > maxW) { h = h * (maxW / w); w = maxW; }
          else if (h > maxW) { w = w * (maxH / h); h = maxH; }
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          currentBase64Image = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('add-image-preview').src = currentBase64Image;
          document.getElementById('add-image-preview').style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function saveItem() {
      var id = document.getElementById('edit-id').value;
      var title = document.getElementById('add-title').value;
      var price = document.getElementById('add-price').value;
      var desc = document.getElementById('add-desc').value;
      var loc = document.getElementById('add-location').value;

      if (!title || !price) {
        alert('Введите название и цену!');
        return;
      }

      document.getElementById('save-btn').innerText = 'Сохранение...';

      var itemData = {
        user_id: tgUser.id,
        user_name: tgUser.first_name + (tgUser.username ? ' (@' + tgUser.username + ')' : ''),
        title: title,
        price: parseInt(price),
        description: desc,
        location: loc || 'Уфа',
        image: currentBase64Image,
        status: 'active'
      };

      if (id) {
        supabase.from('items').update(itemData).eq('id', id).then(function() {
          closeModals(); fetchAllData();
        });
      } else {
        supabase.from('items').insert([itemData]).then(function() {
          closeModals(); fetchAllData();
        });
      }
    }

    function deleteItem(id) {
      if (confirm("Вы точно хотите удалить это объявление?")) {
        closeModals();
        supabase.from('items').delete().eq('id', id).then(function() {
          fetchAllData();
        });
      }
    }

    function startEdit(id) {
      var item = null;
      for(var i=0; i<items.length; i++) { if(items[i].id === id) item = items[i]; }
      if(!item) return;
      document.getElementById('modal-form-title').innerText = 'Редактировать лот';
      document.getElementById('edit-id').value = item.id;
      document.getElementById('add-title').value = item.title;
      document.getElementById('add-price').value = item.price;
      document.getElementById('add-desc').value = item.description || '';
      document.getElementById('add-location').value = item.location || '';
      
      currentBase64Image = item.image || '';
      if(currentBase64Image) {
        document.getElementById('add-image-preview').src = currentBase64Image;
        document.getElementById('add-image-preview').style.display = 'block';
      } else {
        document.getElementById('add-image-preview').style.display = 'none';
      }
      document.getElementById('save-btn').innerText = 'Сохранить изменения';
      openModal('add-modal');
    }

    function openItem(id) {
      var item = null;
      for(var i=0; i<items.length; i++) { if(items[i].id === id) item = items[i]; }
      if(!item) return;
      currentSelectedItem = item;

      var isMine = (Number(item.user_id) === Number(tgUser.id));

      document.getElementById('detail-img').src = item.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80';
      document.getElementB
