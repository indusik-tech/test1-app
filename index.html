<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resale Platform</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0a0a0a; --card: #1a1a1c; --border: #262626; --accent: #ffffff; --text: #ffffff; --muted: #a3a3a3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .scroll { overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; flex: 1; }
    .scroll::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    .tab { display: none; padding: 16px; padding-bottom: 90px; }
    .tab.active { display: block; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
    .nav { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 24px; z-index: 40; }
    .nav-btn { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; cursor: pointer; flex: 1; }
    .nav-btn.active { color: var(--accent); }
    .fab { position: absolute; left: 50%; transform: translateX(-50%); top: -24px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #000; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 50; display: none; flex-direction: column; }
    .modal.show { display: flex; }
    .m-head { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); align-items: center; }
    .inp { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; outline: none; font-size: 14px; }
    .btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 14px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; }
    .btn-dark { background: var(--card); color: #fff; border: 1px solid var(--border); }
    .btn-red { background: #ef4444; color: #fff; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 100%; width: 100%; }
    .slider::-webkit-scrollbar { display: none; }
    .slide { min-width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
    .p-wrap { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .p-box { position: relative; width: 84px; height: 84px; flex-shrink: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .p-box img { width: 100%; height: 100%; object-fit: cover; }
    .p-act { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; }
    .p-btn { background: rgba(0,0,0,0.75); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div class="scroll">
    <div id="tab-feed" class="tab active">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
          <p style="color:var(--muted); font-size:14px;" id="welcome-text">Добрый день!</p>
          <h1 style="font-size:22px; font-weight:bold; margin-top:2px;">Что ищем сегодня?</h1>
        </div>
        <button id="top-mod-btn" onclick="openModal('mod-modal')" style="display:none; background:#ef4444; color:#fff; border:none; padding:10px 14px; border-radius:12px; font-size:12px; font-weight:bold;">🛡 Отзывы (<span id="mod-cnt-1">0</span>)</button>
      </div>
      <input type="text" id="search-input" placeholder="Поиск по объявлениям..." class="inp" oninput="renderFeed()">
      <div id="feed-items" class="grid"></div>
    </div>

    <div id="tab-profile" class="tab">
      <div style="text-align:center; padding:20px 0; border-bottom:1px solid var(--border);">
        <div style="width:80px; height:80px; background:#262626; border-radius:50%; margin:0 auto 12px; overflow:hidden;">
          <img id="profile-avatar" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400&q=80" style="width:100%; height:100%; object-fit:cover;">
        </div>
        <h1 id="profile-name" style="font-size:20px; font-weight:bold;">Пользователь</h1>
        <p id="admin-badge" style="color:#ef4444; font-size:12px; font-weight:bold; display:none; margin-top:4px;">👑 АДМИНИСТРАТОР</p>
        <button id="prof-mod-btn" onclick="openModal('mod-modal')" class="btn btn-red" style="display:none; margin-top:14px;">Проверка отзывов (<span id="mod-cnt-2">0</span>)</button>
      </div>
      <h2 style="font-size:18px; font-weight:bold; margin:20px 0 12px;">Выложенные лоты (<span id="mylots-count">0</span>)</h2>
      <div id="mylots-items" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <div class="nav pb-safe">
    <button class="nav-btn active" id="btn-feed" onclick="switchTab('feed')"><div style="font-size:20px;">🏠</div>Лента</button>
    <div style="flex:1; position:relative;"><button class="fab" onclick="openAddModal()">➕</button></div>
    <button class="nav-btn" id="btn-profile" onclick="switchTab('profile')"><div style="font-size:20px;">👤</div>Профиль</button>
  </div>

  <div id="add-modal" class="modal">
    <div class="m-head">
      <button onclick="closeModals()" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
      <h2 id="modal-form-title" style="font-size:16px; font-weight:bold;">Новое объявление</h2>
      <div style="width:20px;"></div>
    </div>
    <div class="scroll" style="padding:16px;">
      <input type="hidden" id="edit-id">
      <p style="font-size:12px; color:var(--muted); margin-bottom:8px;">Фотографии (<span id="img-cnt">0</span>/10):</p>
      <div id="image-previews" class="p-wrap"></div>
      <button onclick="triggerAddPhoto()" class="btn btn-dark" style="margin-bottom:12px; padding:12px;">+ Выбрать фото из галереи</button>
      <input type="file" id="add-image-file" accept="image/*" multiple style="display:none;" onchange="handleFiles(this)">
      <input type="file" id="replace-image-file" accept="image/*" style="display:none;" onchange="handleReplace(this)">
      <input type="text" id="add-title" class="inp" placeholder="Название вещи">
      <input type="number" id="add-price" class="inp" placeholder="Цена (₽)">
      <input type="text" id="add-location" class="inp" placeholder="Город">
      <textarea id="add-desc" class="inp" placeholder="Описание, состояние, размер..." rows="4"></textarea>
    </div>
    <div style="padding:16px;" class="pb-safe">
      <button class="btn" onclick="saveItem()" id="save-btn">Опубликовать</button>
    </div>
  </div>

  <div id="item-modal" class="modal" style="z-index:60;">
    <div style="position:relative; height:45%; background:#262626;">
      <div id="detail-slider" class="slider"></div>
      <button onclick="closeModals()" style="position:absolute; top:16px; left:16px; background:rgba(0,0,0,0.6); border:none; color:#fff; border-radius:50%; width:34px; height:34px; font-size:16px;">✕</button>
      <div id="detail-photo-count" style="position:absolute; bottom:10px; right:12px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:10px; font-size:11px;"></div>
    </div>
    <div class="scroll" style="padding:16px;">
      <h1 id="detail-title" style="font-size:20px; font-weight:bold;"></h1>
      <p id="detail-price" style="font-size:24px; font-weight:bold; margin-top:4px;"></p>
      <p id="detail-rating" style="font-size:14px; margin-top:6px; color:#facc15; font-weight:bold;"></p>
      <div style="display:flex; justify-content:space-between; margin-top:12px; color:var(--muted); font-size:12px; padding-bottom:12px; border-bottom:1px solid var(--border);">
        <span id="detail-location"></span>
        <span id="detail-seller"></span>
      </div>
      <p id="detail-desc" style="color:var(--muted); font-size:14px; margin-top:14px; line-height:1.5;"></p>
      <div id="detail-reviews" style="margin-top:20px; border-top:1px solid var(--border); padding-top:12px;"></div>
    </div>
    <div class="pb-safe" style="padding:16px; background:var(--bg); display:flex; flex-direction:column; gap:8px;" id="detail-actions"></div>
  </div>

  <div id="review-modal" class="modal" style="z-index:70;">
    <div class="m-head">
      <button onclick="document.getElementById('review-modal').classList.remove('show')" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
      <h2 style="font-size:16px; font-weight:bold;">Оставить отзыв</h2>
      <div style="width:20px;"></div>
    </div>
    <div class="scroll" style="padding:16px;">
      <input type="hidden" id="rev-seller-id">
      <select id="rev-stars" class="inp">
        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
        <option value="4">⭐⭐⭐⭐ (4)</option>
        <option value="3">⭐⭐⭐ (3)</option>
        <option value="2">⭐⭐ (2)</option>
        <option value="1">⭐ (1)</option>
      </select>
      <textarea id="rev-text" class="inp" placeholder="Напишите ваш отзыв..." rows="4"></textarea>
    </div>
    <div style="padding:16px;" class="pb-safe">
      <button class="btn" onclick="submitReview()">Отправить на проверку</button>
    </div>
  </div>

  <div id="mod-modal" class="modal" style="z-index:80;">
    <div class="m-head">
      <button onclick="closeModals()" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
      <h2 style="font-size:16px; font-weight:bold;">Отзывы на модерации</h2>
      <div style="width:20px;"></div>
    </div>
    <div class="scroll" style="padding:16px; display:flex; flex-direction:column; gap:10px;" id="mod-list"></div>
  </div>

  <script>
    var MY_ADMIN_ID = 1879880417;
    var SUPABASE_URL = 'https://qlomefucenvjktwacwow.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_cIsEZCsfm19S9mnS2YYorA_4mpyVYyp';
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var tgUser = { id: 1879880417, first_name: "Админ", username: "", photo_url: "" };
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor('#0a0a0a');
      if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        tgUser = window.Telegram.WebApp.initDataUnsafe.user;
      }
    }

    var IS_ADMIN = (Number(tgUser.id) === MY_ADMIN_ID);
    document.getElementById('welcome-text').innerText = 'Добрый день, ' + tgUser.first_name + '!';
    document.getElementById('profile-name').innerText = tgUser.first_name;
    if (tgUser.photo_url) document.getElementById('profile-avatar').src = tgUser.photo_url;
    if (IS_ADMIN) {
      document.getElementById('admin-badge').style.display = 'block';
      document.getElementById('top-mod-btn').style.display = 'block';
      document.getElementById('prof-mod-btn').style.display = 'block';
    }

    var items = [], reviews = [], curImgs = [], repIdx = -1, curItem = null;
    var defImg = 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80';

    function getImgs(val) {
      if (!val) return [];
      try { var a = JSON.parse(val); return Array.isArray(a) ? a : [val]; } catch(e) { return [val]; }
    }

    function fetchAll() {
      supabase.from('items').select('*').order('created_at', { ascending: false }).then(function(r) {
        if (!r.error) { items = r.data || []; renderFeed(); renderMyLots(); }
      });
      supabase.from('reviews').select('*').order('created_at', { ascending: false }).then(function(r) {
        if (!r.error) { reviews = r.data || []; if (IS_ADMIN) renderMod(); }
      });
    }

    function renderFeed() {
      var q = (document.getElementById('search-input').value || '').toLowerCase();
      var h = '';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (q && (it.title || '').toLowerCase().indexOf(q) === -1) continue;
        var im = getImgs(it.image)[0] || defImg;
        h += '<div class="card" style="overflow:hidden; cursor:pointer;" onclick="openItem(' + it.id + ')">' +
          '<div style="width:100%; aspect-ratio:4/5; background:#262626;"><img src="' + im + '" style="width:100%; height:100%; object-fit:cover;"></div>' +
          '<div style="padding:12px;"><p style="font-weight:bold;">' + (it.price || 0).toLocaleString() + ' ₽</p>' +
          '<p style="font-size:12px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + it.title + '</p>' +
          '<p style="font-size:10px; color:var(--muted); margin-top:4px;">📍 ' + (it.location || 'Уфа') + '</p></div></div>';
      }
      document.getElementById('feed-items').innerHTML = h;
    }

    function renderMyLots() {
      var cnt = 0, h = '';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (Number(it.user_id) === Number(tgUser.id)) {
          cnt++;
          h += '<div class="card" style="padding:16px; cursor:pointer;" onclick="openItem(' + it.id + ')">' +
            '<h3 style="font-size:14px;">' + it.title + '</h3>' +
            '<p style="font-size:18px; font-weight:bold; margin-top:4px;">' + (it.price || 0).toLocaleString() + ' ₽</p></div>';
        }
      }
      document.getElementById('mylots-count').innerText = cnt;
      document.getElementById('mylots-items').innerHTML = h || '<p style="color:var(--muted); font-size:14px; text-align:center;">Пока нет лотов</p>';
    }

    function compress(file, cb) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var c = document.createElement('canvas'), w = img.width, h = img.height, m = 600;
          if (w > h && w > m) { h *= m / w; w = m; } else if (h > m) { w *= m / h; h = m; }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(c.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function triggerAddPhoto() {
      if (curImgs.length >= 10) { alert('Максимум 10 фото!'); return; }
      document.getElementById('add-image-file').click();
    }

    function handleFiles(inp) {
      var files = inp.files;
      for (var i = 0; i < files.length; i++) {
        if (curImgs.length >= 10) break;
        compress(files[i], function(b64) {
          if (curImgs.length < 10) { curImgs.push(b64); renderPreviews(); }
        });
      }
      inp.value = '';
    }

    function startReplace(idx) {
      repIdx = idx;
      document.getElementById('replace-image-file').click();
    }

    function handleReplace(inp) {
      if (inp.files && inp.files[0] && repIdx > -1) {
        compress(inp.files[0], function(b64) {
          curImgs[repIdx] = b64;
          renderPreviews();
        });
      }
      inp.value = '';
    }

    function removeImg(idx) {
      curImgs.splice(idx, 1);
      renderPreviews();
    }

    function renderPreviews() {
      document.getElementById('img-cnt').innerText = curImgs.length;
      var h = '';
      for (var i = 0; i < curImgs.length; i++) {
        h += '<div class="p-box"><img src="' + curImgs[i] + '"><div class="p-act">' +
          '<button class="p-btn" onclick="startReplace(' + i + ')">🔄</button>' +
          '<button class="p-btn" onclick="removeImg(' + i + ')">✕</button></div></div>';
      }
      document.getElementById('image-previews').innerHTML = h;
    }

    function openAddModal() {
      document.getElementById('modal-form-title').innerText = 'Новое объявление';
      document.getElementById('edit-id').value = '';
      document.getElementById('add-title').value = '';
      document.getElementById('add-price').value = '';
      document.getElementById('add-location').value = '';
      document.getElementById('add-desc').value = '';
      curImgs = [];
      renderPreviews();
      document.getElementById('save-btn').innerText = 'Опубликовать';
      openModal('add-modal');
    }

    function startEdit(id) {
      var it = null;
      for (var i = 0; i < items.length; i++) if (items[i].id === id) it = items[i];
      if (!it) return;
      closeModals();
      document.getElementById('modal-form-title').innerText = 'Редактировать лот';
      document.getElementById('edit-id').value = it.id;
      document.getElementById('add-title').value = it.title;
      document.getElementById('add-price').value = it.price;
      document.getElementById('add-location').value = it.location || '';
      document.getElementById('add-desc').value = it.description || '';
      curImgs = getImgs(it.image);
      renderPreviews();
      document.getElementById('save-btn').innerText = 'Сохранить';
      openModal('add-modal');
    }

    function saveItem() {
      var id = document.getElementById('edit-id').value;
      var t = document.getElementById('add-title').value;
      var p = document.getElementById('add-price').value;
      var l = document.getElementById('add-location').value;
      var d = document.getElementById('add-desc').value;
      if (!t || !p) { alert('Укажите название и цену!'); return; }
      document.getElementById('save-btn').innerText = 'Сохранение...';
      var dObj = {
        title: t, price: parseInt(p), location: l || 'Уфа', description: d,
        image: JSON.stringify(curImgs), status: 'active'
      };
      if (id) {
        supabase.from('items').update(dObj).eq('id', id).then(function() { closeModals(); fetchAll(); });
      } else {
        dObj.user_id = tgUser.id;
        dObj.user_name = tgUser.first_name + (tgUser.username ? ' (@' + tgUser.username + ')' : '');
        supabase.from('items').insert([dObj]).then(function() { closeModals(); fetchAll(); });
      }
    }

    function deleteItem(id) {
      if (confirm('Удалить это объявление?')) {
        closeModals();
        supabase.from('items').delete().eq('id', id).then(fetchAll);
      }
    }

    function getSellerStats(sId) {
      var c = 0, s = 0, listHtml = '';
      for (var i = 0; i < reviews.length; i++) {
        var r = reviews[i];
        if (Number(r.seller_id) === Number(sId) && r.status === 'active') {
          c++; s += Number(r.rating);
          listHtml += '<div style="background:var(--card); padding:10px; border-radius:10px; margin-top:8px;">' +
            '<p style="font-size:12px; color:#facc15;">⭐ ' + r.rating + '/5 — ' + r.reviewer_name + '</p>' +
            '<p style="font-size:13px; margin-top:4px;">' + r.comment + '</p></div>';
        }
      }
      return {
        head: c === 0 ? '⭐ Нет отзывов (0)' : '⭐ ' + (s / c).toFixed(1) + ' (' + c + ' отз.)',
        list: listHtml ? '<h3 style="font-size:14px;">Отзывы о продавце:</h3>' + listHtml : ''
      };
    }

    function openItem(id) {
      var it = null;
      for (var i = 0; i < items.length; i++) if (items[i].id === id) it = items[i];
      if (!it) return;
      curItem = it;
      var imgs = getImgs(it.image);
      if (!imgs.length) imgs = [defImg];
      var sHtml = '';
