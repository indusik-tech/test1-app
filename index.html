<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resale Platform</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0a0a0a; --card:#1a1a1c; --brd:#262626; --acc:#ffffff; --txt:#ffffff; --mut:#a3a3a3; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--txt); font-family:sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    .scroll { overflow-y:auto; scrollbar-width:none; flex:1; }
    .scroll::-webkit-scrollbar { display:none; }
    .pb { padding-bottom:max(env(safe-area-inset-bottom),20px); }
    .tab { display:none; padding:16px 16px 90px; }
    .tab.active { display:block; }
    .card { background:var(--card); border:1px solid var(--brd); border-radius:16px; }
    .nav { position:absolute; bottom:0; left:0; width:100%; background:rgba(10,10,10,0.95); border-top:1px solid var(--brd); display:flex; justify-content:space-around; padding:12px 24px; z-index:40; }
    .nav-b { background:none; border:none; color:var(--mut); display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; font-weight:600; flex:1; }
    .nav-b.active { color:var(--acc); }
    .fab { position:absolute; left:50%; transform:translateX(-50%); top:-24px; width:56px; height:56px; border-radius:50%; background:var(--acc); color:#000; border:none; font-size:24px; display:flex; align-items:center; justify-content:center; }
    .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:50; display:none; flex-direction:column; }
    .modal.show { display:flex; }
    .m-hd { display:flex; justify-content:space-between; padding:16px; border-bottom:1px solid var(--brd); align-items:center; }
    .inp { width:100%; background:var(--card); border:1px solid var(--brd); color:var(--txt); padding:14px; border-radius:12px; margin-bottom:12px; outline:none; font-size:14px; }
    .btn { width:100%; background:var(--acc); color:#000; border:none; padding:14px; border-radius:14px; font-weight:bold; font-size:15px; text-align:center; }
    .btn-d { background:var(--card); color:#fff; border:1px solid var(--brd); }
    .btn-r { background:#ef4444; color:#fff; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .slider { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; height:100%; width:100%; }
    .slide { min-width:100%; height:100%; object-fit:cover; scroll-snap-align:start; }
    .p-wrap { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; }
    .p-box { position:relative; width:80px; height:80px; flex-shrink:0; border-radius:10px; overflow:hidden; border:1px solid var(--brd); }
    .p-box img { width:100%; height:100%; object-fit:cover; }
    .p-act { position:absolute; top:3px; right:3px; display:flex; gap:3px; }
    .p-btn { background:rgba(0,0,0,0.8); color:#fff; border:none; border-radius:50%; width:22px; height:22px; font-size:11px; }
  </style>
</head>
<body>
  <div class="scroll">
    <div id="tab-feed" class="tab active">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
          <p style="color:var(--mut); font-size:14px;" id="welcome-text">Добрый день!</p>
          <h1 style="font-size:22px; font-weight:bold; margin-top:2px;">Маркетплейс</h1>
        </div>
        <button id="top-mod-btn" onclick="openM('mod-modal')" style="background:#ef4444; color:#fff; border:none; padding:10px 12px; border-radius:12px; font-size:12px; font-weight:bold;">🛡 Отзывы (<span id="mod-cnt">0</span>)</button>
      </div>
      <input type="text" id="search-input" placeholder="Поиск по объявлениям..." class="inp" oninput="renderFeed()">
      <div id="feed-items" class="grid"></div>
    </div>

    <div id="tab-profile" class="tab">
      <div style="text-align:center; padding:16px 0; border-bottom:1px solid var(--brd);">
        <div style="width:76px; height:76px; background:#262626; border-radius:50%; margin:0 auto 10px; overflow:hidden;">
          <img id="profile-avatar" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400&q=80" style="width:100%; height:100%; object-fit:cover;">
        </div>
        <h1 id="profile-name" style="font-size:20px; font-weight:bold;">Пользователь</h1>
        <p id="admin-badge" style="color:#ef4444; font-size:12px; font-weight:bold; margin-top:4px;">👑 АДМИНИСТРАТОР</p>
        <button id="prof-mod-btn" onclick="openM('mod-modal')" class="btn btn-r" style="margin-top:12px;">Модерация отзывов (<span id="mod-cnt-2">0</span>)</button>
      </div>
      <h2 style="font-size:18px; font-weight:bold; margin:16px 0 12px;">Выложенные лоты (<span id="mylots-count">0</span>)</h2>
      <div id="mylots-items" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
  </div>

  <div class="nav pb">
    <button class="nav-b active" id="btn-feed" onclick="swTab('feed')"><div style="font-size:20px;">🏠</div>Лента</button>
    <div style="flex:1; position:relative;"><button class="fab" onclick="openAdd()">➕</button></div>
    <button class="nav-b" id="btn-profile" onclick="swTab('profile')"><div style="font-size:20px;">👤</div>Профиль</button>
  </div>

  <div id="add-modal" class="modal">
    <div class="m-hd">
      <button onclick="closeM()" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
      <h2 id="m-title" style="font-size:16px;">Новое объявление</h2>
      <div style="width:20px;"></div>
    </div>
    <div class="scroll" style="padding:16px;">
      <input type="hidden" id="edit-id">
      <p style="font-size:12px; color:var(--mut); margin-bottom:8px;">Фото (<span id="img-cnt">0</span>/10):</p>
      <div id="img-prev" class="p-wrap"></div>
      <button onclick="addPhClick()" class="btn btn-d" style="margin-bottom:12px; padding:12px;">+ Выбрать фото (до 10 шт)</button>
      <input type="file" id="f-add" accept="image/*" multiple style="display:none;" onchange="hFiles(this)">
      <input type="file" id="f-rep" accept="image/*" style="display:none;" onchange="hRep(this)">
      <input type="text" id="a-title" class="inp" placeholder="Название вещи">
      <input type="number" id="a-price" class="inp" placeholder="Цена (₽)">
      <input type="text" id="a-loc" class="inp" placeholder="Город">
      <textarea id="a-desc" class="inp" placeholder="Описание, состояние, размер..." rows="4"></textarea>
    </div>
    <div style="padding:16px;" class="pb"><button class="btn" onclick="saveIt()" id="save-btn">Опубликовать</button></div>
  </div>

  <div id="item-modal" class="modal" style="z-index:60;">
    <div style="position:relative; height:44%; background:#262626;">
      <div id="d-slider" class="slider"></div>
      <button onclick="closeM()" style="position:absolute; top:16px; left:16px; background:rgba(0,0,0,0.6); border:none; color:#fff; border-radius:50%; width:34px; height:34px;">✕</button>
      <div id="d-pcnt" style="position:absolute; bottom:10px; right:12px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:8px; font-size:11px;"></div>
    </div>
    <div class="scroll" style="padding:16px;">
      <h1 id="d-title" style="font-size:20px;"></h1>
      <p id="d-price" style="font-size:24px; font-weight:bold; margin-top:4px;"></p>
      <p id="d-rate" style="font-size:14px; margin-top:6px; color:#facc15; font-weight:bold;"></p>
      <div style="display:flex; justify-content:space-between; margin-top:10px; color:var(--mut); font-size:12px; padding-bottom:10px; border-bottom:1px solid var(--brd);">
        <span id="d-loc"></span><span id="d-sell"></span>
      </div>
      <p id="d-desc" style="color:var(--mut); font-size:14px; margin-top:12px; line-height:1.4;"></p>
      <div id="d-revs" style="margin-top:16px; border-top:1px solid var(--brd); padding-top:12px;"></div>
    </div>
    <div class="pb" style="padding:16px; background:var(--bg); display:flex; flex-direction:column; gap:8px;" id="d-acts"></div>
  </div>

  <div id="review-modal" class="modal" style="z-index:70;">
    <div class="m-hd">
      <button onclick="$('review-modal').classList.remove('show')" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
      <h2 style="font-size:16px;">Оставить отзыв</h2><div style="width:20px;"></div>
    </div>
    <div class="scroll" style="padding:16px;">
      <input type="hidden" id="r-sid">
      <select id="r-star" class="inp">
        <option value="5">⭐⭐⭐⭐⭐ (5)</option><option value="4">⭐⭐⭐⭐ (4)</option>
        <option value="3">⭐⭐⭐ (3)</option><option value="2">⭐⭐ (2)</option><option value="1">⭐ (1)</option>
      </select>
      <textarea id="r-txt" class="inp" placeholder="Напишите отзыв..." rows="4"></textarea>
    </div>
    <div style="padding:16px;" class="pb"><button class="btn" onclick="sendRev()">Отправить</button></div>
  </div>

  <div id="mod-modal" class="modal" style="z-index:80;">
    <div class="m-hd">
      <button onclick="closeM()" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
      <h2 style="font-size:16px;">Модерация отзывов</h2><div style="width:20px;"></div>
    </div>
    <div class="scroll" style="padding:16px; display:flex; flex-direction:column; gap:10px;" id="mod-list"></div>
  </div>

  <script>
    function $(id){ return document.getElementById(id); }
    var ADMIN_ID = 1879880417;
    var sb = window.supabase.createClient('https://qlomefucenvjktwacwow.supabase.co', 'sb_publishable_cIsEZCsfm19S9mnS2YYorA_4mpyVYyp');
    var usr = { id:1879880417, first_name:"Админ", username:"", photo_url:"" };
    if (window.Telegram && window.Telegram.WebApp) {
      var tw = window.Telegram.WebApp; tw.ready(); tw.expand();
      if (tw.initDataUnsafe && tw.initDataUnsafe.user) usr = tw.initDataUnsafe.user;
    }
    var isAdm = (Number(usr.id) === ADMIN_ID);
    $('welcome-text').innerText = 'Привет, ' + usr.first_name + '!';
    $('profile-name').innerText = usr.first_name;
    if (usr.photo_url) $('profile-avatar').src = usr.photo_url;
    if (!isAdm) {
      $('admin-badge').style.display = 'none';
      $('top-mod-btn').style.display = 'none';
      $('prof-mod-btn').style.display = 'none';
    }

    var items = [], revs = [], cImgs = [], repI = -1, curIt = null;
    var defIm = 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80';

    function pImgs(v) {
      if (!v) return [];
      try { var a = JSON.parse(v); return Array.isArray(a) ? a : [v]; } catch(e) { return [v]; }
    }

    function loadAll() {
      sb.from('items').select('*').order('created_at',{ascending:false}).then(function(r){
        if (!r.error) { items = r.data || []; renderFeed(); renderMy(); }
      });
      sb.from('reviews').select('*').order('created_at',{ascending:false}).then(function(r){
        if (!r.error) { revs = r.data || []; renderMod(); }
      });
    }

    function renderFeed() {
      var q = ($('search-input').value || '').toLowerCase(), h = '';
      for (var i=0; i<items.length; i++) {
        var it = items[i];
        if (q && (it.title||'').toLowerCase().indexOf(q) === -1) continue;
        var im = pImgs(it.image)[0] || defIm;
        h += '<div class="card" style="overflow:hidden;" onclick="openIt('+it.id+')">' +
          '<div style="width:100%;aspect-ratio:4/5;background:#262626;"><img src="'+im+'" style="width:100%;height:100%;object-fit:cover;"></div>' +
          '<div style="padding:10px;"><p style="font-weight:bold;">'+(it.price||0).toLocaleString()+' ₽</p>' +
          '<p style="font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+it.title+'</p>' +
          '<p style="font-size:10px;color:var(--mut);margin-top:4px;">📍 '+(it.location||'Уфа')+'</p></div></div>';
      }
      $('feed-items').innerHTML = h;
    }

    function renderMy() {
      var c = 0, h = '';
      for (var i=0; i<items.length; i++) {
        var it = items[i];
        if (Number(it.user_id) === Number(usr.id)) {
          c++;
          h += '<div class="card" style="padding:14px;" onclick="openIt('+it.id+')"><b>'+it.title+'</b><p style="margin-top:4px;">'+(it.price||0).toLocaleString()+' ₽</p></div>';
        }
      }
      $('mylots-count').innerText = c;
      $('mylots-items').innerHTML = h || '<p style="color:var(--mut);text-align:center;">Нет объявлений</p>';
    }

    function compr(file, cb) {
      var rd = new FileReader();
      rd.onload = function(e) {
        var im = new Image();
        im.onload = function() {
          var cv = document.createElement('canvas'), w = im.width, h = im.height, m = 600;
          if (w>h && w>m) { h*=m/w; w=m; } else if (h>m) { w*=m/h; h=m; }
          cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im,0,0,w,h);
          cb(cv.toDataURL('image/jpeg',0.7));
        };
        im.src = e.target.result;
      };
      rd.readAsDataURL(file);
    }

    function addPhClick() { if (cImgs.length>=10) alert('Максимум 10 фото'); else $('f-add').click(); }
    function hFiles(inp) {
      for (var i=0; i<inp.files.length; i++) {
        if (cImgs.length>=10) break;
        compr(inp.files[i], function(b){ if (cImgs.length<10){ cImgs.push(b); rPrev(); } });
      }
      inp.value = '';
    }
    function sRep(i) { repI = i; $('f-rep').click(); }
    function hRep(inp) {
      if (inp.files[0] && repI>-1) compr(inp.files[0], function(b){ cImgs[repI]=b; rPrev(); });
      inp.value = '';
    }
    function rmImg(i) { cImgs.splice(i,1); rPrev(); }
    function rPrev() {
      $('img-cnt').innerText = cImgs.length;
      var h = '';
      for (var i=0; i<cImgs.length; i++) {
        h += '<div class="p-box"><img src="'+cImgs[i]+'"><div class="p-act">' +
          '<button class="p-btn" onclick="sRep('+i+')">🔄</button><button class="p-btn" onclick="rmImg('+i+')">✕</button></div></div>';
      }
      $('img-prev').innerHTML = h;
    }

    function openAdd() {
      $('m-title').innerText = 'Новое объявление'; $('edit-id').value = '';
      $('a-title').value = ''; $('a-price').value = ''; $('a-loc').value = ''; $('a-desc').value = '';
      cImgs = []; rPrev(); $('save-btn').innerText = 'Опубликовать'; openM('add-modal');
    }

    function startEd(id) {
      var it = items.find(function(x){return x.id===id;}); if (!it) return;
      closeM(); $('m-title').innerText = 'Редактировать'; $('edit-id').value = it.id;
      $('a-title').value = it.title; $('a-price').value = it.price;
      $('a-loc').value = it.location||''; $('a-desc').value = it.description||'';
      cImgs = pImgs(it.image); rPrev(); $('save-btn').innerText = 'Сохранить'; openM('add-modal');
    }

    function saveIt() {
      var id = $('edit-id').value, t = $('a-title').value, p = $('a-price').value;
      if (!t || !p) { alert('Введите название и цену'); return; }
      $('save-btn').innerText = 'Ждите...';
      var d = { title:t, price:parseInt(p), location:$('a-loc').value||'Уфа', description:$('a-desc').value, image:JSON.stringify(cImgs), status:'active' };
      if (id) sb.from('items').update(d).eq('id',id).then(function(){ closeM(); loadAll(); });
      else {
        d.user_id = usr.id; d.user_name = usr.first_name + (usr.username ? ' (@'+usr.username+')' : '');
        sb.from('items').insert([d]).then(function(){ closeM(); loadAll(); });
      }
    }

    function delIt(id) {
      if (confirm('Удалить лот?')) { closeM(); sb.from('items').delete().eq('id',id).then(loadAll); }
    }

    function openIt(id) {
      var it = items.find(function(x){return x.id===id;}); if (!it) return;
      curIt = it; var ims = pImgs(it.image); if (!ims.length) ims = [defIm];
      $('d-slider').innerHTML = ims.map(function(u){return '<img class="slide" src="'+u+'">';}).join('');
      $('d-pcnt').innerText = ims.length + ' фото';
      $('d-title').innerText = it.title; $('d-price').innerText = (it.price||0).toLocaleString() + ' ₽';
      $('d-loc').innerText = '📍 ' + (it.location||'Уфа'); $('d-sell').innerText = '👤 ' + (it.user_name||'Продавец');
      $('d-desc').innerText = it.description || 'Без описания';

      var c = 0, s = 0, rh = '';
      for (var i=0; i<revs.length; i++) {
        var r = revs[i];
        if (Number(r.seller_id)===Number(it.user_id) && r.status==='active') {
          c++; s += Number(r.rating);
          rh += '<div style="background:var(--card);padding:8px;border-radius:8px;margin-top:6px;"><b style="color:#facc15;font-size:12px;">⭐ '+r.rating+'/5 — '+r.reviewer_name+'</b><p style="font-size:13px;margin-top:2px;">'+r.comment+'</p></div>';
        }
      }
      $('d-rate').innerText = c ? '⭐ '+(s/c).toFixed(1)+' ('+c+' отз.)' : '⭐ Нет отзывов';
      $('d-revs').innerHTML = rh;

      var my = (Number(it.user_id) === Number(usr.id));
      var b = '<button onclick="chatSell()" class="btn">Написать продавцу</button>' +
              '<button onclick="openRev('+it.user_id+')" class="btn btn-d">Оставить отзыв</button>';
      if (my || isAdm) {
        b += '<div style="display:flex;gap:8px;"><button onclick="startEd('+it.id+')" class="btn btn-d" style="flex:1;">Редакт.</button>' +
             '<button onclick="delIt('+it.id+')" class="btn btn-r" style="flex:1;">Удалить</button></div>';
      }
      $('d-acts').innerHTML = b; openM('item-modal');
    }

    function chatSell() {
      if (!curIt) return;
      var m = (curIt.user_name||'').match(/@(\w+)/);
      if (m && window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.openTelegramLink('https://t.me/'+m[1]);
      else alert('Связь с продавцом: ' + (curIt.user_name || 'ID ' + curIt.user_id));
    }

    function openRev(sId) { $('r-sid').value = sId; $('r-txt').value = ''; openM('review-modal'); }
    function sendRev() {
      var tx = $('r-txt').value; if (!tx) return;
      sb.from('reviews').insert([{ seller_id:Number($('r-sid').value), reviewer_name:usr.first_name, rating:Number($('r-star').value), comment:tx, status:'pending' }]).then(function(){
        $('review-modal').classList.remove('show'); alert('Отзыв отправлен на модерацию!'); loadAll();
      });
    }

    function renderMod() {
      var p = revs.filter(function(r){return r.status==='pending';});
      $('mod-cnt').innerText = p.length; $('mod-cnt-2').innerText = p.length;
      var h = '';
      for (var i=0; i<p.length; i++) {
        var r = p[i];
        h += '<div class="card" style="padding:12px;"><p style="font-size:12px;color:var(--mut);">От '+r.reviewer_name+' ➔ ID '+r.seller_id+'</p>' +
          '<p style="color:#facc15;font-weight:bold;margin:4px 0;">⭐ '+r.rating+'/5</p><p style="font-size:14px;margin-bottom:8px;">'+r.comment+'</p>' +
          '<div style="display:flex;gap:8px;"><button onclick="modAct('+r.id+',1)" class="btn" style="flex:1;padding:8px;">Одобрить</button>' +
          '<button onclick="modAct('+r.id+',0)" class="btn btn-r" style="flex:1;padding:8px;">Удалить</button></div></div>';
      }
      $('mod-list').innerHTML = h || '<p style="color:var(--mut);text-align:center;">Нет новых отзывов</p>';
    }

    function modAct(id, ok) {
      if (ok) sb.from('reviews').update({status:'active'}).eq('id',id).then(loadAll);
      else sb.from('reviews').delete().eq('id',id).then(loadAll);
    }

    function swTab(t) {
      $('tab-feed').classList.remove('active'); $('tab-profile').classList.remove('active'); $('tab-'+t).classList.add('active');
      $('btn-feed').classList.remove('active'); $('btn-profile').classList.remove('active'); $('btn-'+t).classList.add('active');
    }
    function openM(id) { $(id).classList.add('show'); }
    function closeM() { var m = document.querySelectorAll('.modal'); for (var i=0;i<m.length;i++) m[i].classList
