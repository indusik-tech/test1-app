<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Market Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08080a;
      --card: #121216;
      --card-elevated: #1a1a20;
      --border: #26262e;
      --text: #ffffff;
      --muted: #8e8e96;
      --accent: #ffffff;
      --accent-fg: #000000;
      --danger: #ff453a;
      --success: #32d74b;
      --radius-xl: 22px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 110px;
      overflow-x: hidden;
      user-select: none;
    }

    .hidden {
      display: none !important;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      font: inherit;
      transition: transform 0.12s ease, opacity 0.12s ease, background-color 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    input, textarea, select {
      font: inherit;
      color: var(--text);
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .greeting-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 3px;
      flex-wrap: wrap;
    }

    .badge-white {
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .main-heading {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .city-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 14px;
      height: 48px;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .filter-trigger {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: var(--accent-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .qa-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .qa-btn.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .qa-btn.active-mode {
      border-color: var(--accent);
      background: var(--card-elevated);
    }

    .qa-btn span {
      font-size: 12px;
      font-weight: 700;
    }

    .promo-row {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .promo-banner {
      border-radius: var(--radius-lg);
      padding: 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90px;
      text-align: left;
    }

    .promo-banner.white {
      background: var(--accent);
      color: var(--accent-fg);
    }

    .promo-banner.dark {
      background: var(--card);
      border: 1px solid var(--border);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .promo-banner.selected-banner {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .promo-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .promo-circle-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-fg);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .promo-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.15;
    }

    .promo-sub {
      font-size: 11px;
      opacity: 0.75;
      font-weight: 600;
      margin-top: 3px;
    }

    .radar-decor {
      position: absolute;
      right: 12px;
      top: 14px;
      width: 44px;
      height: 36px;
    }

    .radar-main {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.18);
      position: absolute;
      left: 8px;
      top: 10px;
    }

    .radar-dot {
      width: 5px;
      height: 5px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.65);
      position: absolute;
    }

    .filter-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 13px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .product-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #18181e;
      overflow: hidden;
    }

    .product-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .exchange-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(8, 8, 10, 0.84);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .exchange-tag::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
    }

    .like-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(12, 12, 16, 0.72);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 2;
    }

    .like-btn.liked svg {
      fill: #ffffff;
    }

    .thumb-dots {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(12, 12, 16, 0.72);
      padding: 4px 7px;
      border-radius: 999px;
      display: flex;
      gap: 4px;
    }

    .thumb-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
    }

    .thumb-dots span.active {
      background: #ffffff;
    }

    .product-info {
      padding: 10px 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .product-price {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .product-title {
      font-size: 13px;
      font-weight: 600;
      color: #e6e6ec;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.6px;
      margin-bottom: 3px;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .pills-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .pill-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .hint-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .hint-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .lot-row-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px;
      margin-bottom: 10px;
    }

    .lot-row-top {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
      flex-wrap: wrap;
    }

    .green-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    .lot-row-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .lot-row-price {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 13px;
    }

    .lot-row-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lot-row-stats {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .lot-row-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-sm-white {
      background: var(--accent);
      color: var(--accent-fg);
      padding: 8px 13px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-sm-ghost {
      background: var(--card-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 11px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-sm-danger {
      background: rgba(255, 69, 58, 0.14);
      color: var(--danger);
      border: 1px solid rgba(255, 69, 58, 0.32);
      padding: 8px 11px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .profile-banner {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.2), transparent 70%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.035) 0px, rgba(255, 255, 255, 0.035) 10px, transparent 10px, transparent 20px);
      border-bottom: 1px solid var(--border);
      padding: 28px 16px 20px;
      text-align: center;
      margin: -14px -16px 16px;
    }

    .avatar-circle {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      margin: 0 auto 10px;
      overflow: hidden;
      background: var(--card-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .profile-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .profile-Context-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .stat-pill {
      background: rgba(18, 18, 22, 0.92);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .menu-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .section-caption {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.7px;
      color: var(--muted);
      text-transform: uppercase;
      margin: 14px 4px 8px;
    }

    .menu-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .menu-row:last-child {
      border-bottom: none;
    }

    .menu-row:active {
      background: var(--card-elevated);
    }

    .menu-row-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-row-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--card-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-row-title {
      font-size: 14px;
      font-weight: 700;
    }

    .menu-row-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .bottom-bar-wrap {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      z-index: 50;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      flex: 1;
      background: rgba(14, 14, 18, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      height: 64px;
      display: flex;
      padding: 4px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
    }

    .dock-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
    }

    .dock-item.active {
      color: var(--accent);
      background: radial-gradient(circle at 50% 60%, rgba(255, 255, 255, 0.2), transparent 72%);
    }

    .dock-fab {
      pointer-events: auto;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(14, 14, 18, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-window {
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      background: #101014;
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      overflow-y: auto;
      padding: 18px 16px 34px;
      animation: sheetSlideUp 0.2s ease-out;
    }

    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-heading {
      font-size: 18px;
      font-weight: 800;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
    }

    .field-block {
      margin-bottom: 13px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field-input, .field-textarea, .field-select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }

    .field-input:focus, .field-textarea:focus, .field-select:focus {
      border-color: var(--accent);
    }

    .field-textarea {
      min-height: 90px;
      resize: vertical;
    }

    .upload-dropzone {
      border: 1px dashed var(--border);
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .previews-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .preview-thumb {
      position: relative;
      width: 74px;
      height: 74px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .preview-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-del {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-full-white {
      width: 100%;
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 800;
      font-size: 15px;
      padding: 14px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-full-ghost {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid va
