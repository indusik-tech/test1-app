<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Market Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#08080a; --card:#121215; --hover:#1a1a1f; --brd:#242429; --txt:#ffffff; --mut:#8e8e93; --acc:#ffffff; --acc-fg:#000000; --err:#ff453a; --ok:#32d74b; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; font-family:'Inter',sans-serif; }
body { background:var(--bg); color:var(--txt); padding-bottom:105px; overflow-x:hidden; min-height:100vh; }
.hidden { display:none !important; }
.container { padding:14px 16px; max-width:520px; margin:0 auto; }
button { cursor:pointer; border:none; background:none; color:inherit; font:inherit; }
input, textarea { font:inherit; color:var(--txt); }
.top-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:10px; }
.greeting-sub { color:var(--mut); font-size:13px; font-weight:500; margin-bottom:2px; display:flex; align-items:center; gap:6px; }
.admin-badge { background:var(--acc); color:var(--acc-fg); font-size:10px; font-weight:800; padding:2px 6px; border-radius:6px; }
.greeting-title { font-size:22px; font-weight:900; letter-spacing:-0.5px; }
.city-pill { display:flex; align-items:center; gap:5px; background:var(--card); border:1px solid var(--brd); padding:7px 12px; border-radius:99px; font-size:13px; font-weight:600; }
.city-pill svg { width:14px; height:14px; }
.search-row { display:flex; gap:10px; margin-bottom:14px; }
.search-box { flex:1; display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--brd); border-radius:14px; padding:0 14px; height:46px; }
.search-box svg { width:18px; height:18px; color:var(--mut); flex-shrink:0; }
.search-box input { width:100%; background:transparent; border:none; outline:none; font-size:14px; }
.filter-btn { width:46px; height:46px; border-radius:14px; background:var(--acc); color:var(--acc-fg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.quick-actions { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
.qa-card { background:var(--card); border:1px solid var(--brd); border-radius:20px; padding:14px 6px; display:flex; flex-direction:column; align-items:center; gap:7px; }
.qa-card.primary { background:var(--acc); color:var(--acc-fg); border-color:var(--acc); }
.qa-card svg { width:22px; height:22px; }
.qa-card span { font-size:12px; font-weight:700; }
.promo-grid { display:grid; grid-template-columns:1.15fr 0.85fr; gap:8px; margin-bottom:16px; }
.promo-card { border-radius:20px; padding:14px; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; min-height:86px; text-align:left; }
.promo-card.white { background:var(--acc); color:var(--acc-fg); }
.promo-card.dark { background:var(--card); border:1px solid var(--brd); background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px); background-size:18px 18px; }
.promo-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.promo-arrow { width:26px; height:26px; border-radius:50%; background:var(--acc-fg); color:var(--acc); display:flex; align-items:center; justify-content:center; }
.promo-arrow svg { width:15px; height:15px; }
.promo-title { font-size:15px; font-weight:800; line-height:1.15; }
.promo-sub { font-size:11px; opacity:0.7; font-weight:500; margin-top:2px; }
.radar-dots { position:absolute; right:12px; top:14px; width:44px; height:36px; }
.radar-dot-main { width:10px; height:10px; border-radius:50%; background:#fff; box-shadow:0 0 0 5px rgba(255,255,255,0.18); position:absolute; left:8px; top:10px; }
.radar-dot-sm { width:5px; height:5px; border-radius:3px; background:rgba(255,255,255,0.65); position:absolute; }
.listings-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.item-card { background:var(--card); border:1px solid var(--brd); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; }
.item-img-wrap { position:relative; width:100%; aspect-ratio:1/1; background:#1c1c21; overflow:hidden; }
.item-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
.badge-exchange { position:absolute; top:8px; left:8px; background:rgba(10,10,12,0.78); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:11px; font-weight:600; padding:4px 8px; border-radius:99px; display:flex; align-items:center; gap:5px; }
.badge-exchange::before { content:""; width:6px; height:6px; border-radius:50%; background:#fff; }
.fav-btn { position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%; background:rgba(15,15,18,0.65); display:flex; align-items:center; justify-content:center; color:#fff; z-index:2; }
.fav-btn.liked svg { fill:#fff; }
.fav-btn svg { width:16px; height:16px; }
.photo-dots { position:absolute; bottom:8px; right:8px; background:rgba(15,15,18,0.65); padding:4px 7px; border-radius:99px; display:flex; gap:4px; }
.photo-dots span { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.45); }
.photo-dots span.active { background:#fff; }
.item-body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:3px; }
.item-price { font-size:16px; font-weight:900; }
.item-title { font-size:13px; font-weight:500; color:#e5e5ea; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-meta { font-size:11px; color:var(--mut); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.page-title { font-size:28px; font-weight:900; margin-bottom:2px; }
.page-subtitle { font-size:13px; color:var(--mut); margin-bottom:14px; }
.pills-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.pill-tab { padding:8px 16px; border-radius:99px; font-size:13px; font-weight:700; background:var(--card); border:1px solid var(--brd); color:var(--mut); }
.pill-tab.active { background:var(--acc); color:var(--acc-fg); border-color:var(--acc); }
.bump-info-box { background:var(--card); border:1px solid var(--brd); border-radius:20px; padding:14px; display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.bump-icon { width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.my-lot-card { background:var(--card); border:1px solid var(--brd); border-radius:20px; padding:16px; margin-bottom:10px; }
.my-lot-status { font-size:12px; color:var(--mut); display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--ok); }
.my-lot-title { font-size:16px; font-weight:700; margin-bottom:4px; }
.my-lot-price { font-size:20px; font-weight:900; margin-bottom:14px; }
.my-lot-footer { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.my-lot-stats { display:flex; gap:12px; font-size:13px; color:var(--mut); font-weight:600; }
.my-lot-stats span { display:flex; align-items:center; gap:4px; }
.my-lot-stats svg { width:15px; height:15px; }
.my-lot-actions { display:flex; gap:6px; }
.btn-white-sm { background:var(--acc); color:var(--acc-fg); padding:8px 13px; border-radius:12px; font-size:12px; font-weight:800; display:flex; align-items:center; gap:4px; }
.btn-white-sm svg, .btn-ghost-sm svg { width:14px; height:14px; }
.btn-ghost-sm { background:#1f1f24; color:#fff; border:1px solid var(--brd); padding:8px 10px; border-radius:12px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; }
.btn-ghost-sm.danger { color:var(--err); }
.profile-hero { background:radial-gradient(circle at 50% 0%,rgba(255,255,255,0.18),transparent 70%),repeating-linear-gradient(45deg,rgba(255,255,255,0.03) 0,rgba(255,255,255,0.03) 10px,transparent 10px,transparent 20px); border-bottom:1px solid var(--brd); padding:28px 16px 20px; text-align:center; margin:-14px -16px 16px; }
.profile-avatar { width:92px; height:92px; border-radius:50%; border:3px solid var(--acc); margin:0 auto 10px; overflow:hidden; background:#1c1c22; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:900; }
.profile-avatar img { width:100%; height:100%; object-fit:cover; }
.profile-name { font-size:22px; font-weight:900; margin-bottom:2px; }
.profile-since { font-size:12px; color:var(--mut); margin-bottom:14px; }
.profile-badges { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
.p-badge { background:rgba(18,18,21,0.9); border:1px solid var(--brd); padding:6px 12px; border-radius:99px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px; }
.rate-highlight { color:var(--ok); }
.menu-group { background:var(--card); border:1px solid var(--brd); border-radius:20px; overflow:hidden; margin-bottom:16px; }
.menu-section-label { font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; margin:14px 4px 8px; }
.menu-item { width:100%; display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-bottom:1px solid var(--brd); text-align:left; }
.menu-item:last-child { border-bottom:none; }
.menu-item-left { display:flex; align-items:center; gap:12px; }
.menu-icon { width:36px; height:36px; border-radius:10px; background:#1d1d22; display:flex; align-items:center; justify-content:center; color:#fff; }
.menu-icon svg { width:18px; height:18px; }
.menu-title { font-size:14px; font-weight:700; }
.menu-sub { font-size:12px; color:var(--mut); margin-top:1px; }
.menu-chevron { color:var(--mut); width:18px; height:18px; }
.bottom-nav-wrap { position:fixed; bottom:14px; left:0; right:0; z-index:40; padding:0 14px; max-width:520px; margin:0 auto; display:flex; align-items:center; gap:10px; pointer-events:none; }
.bottom-dock { pointer-events:auto; flex:1; background:rgba(15,15,18,0.92); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.16); border-radius:99px; height:62px; display:grid; grid-template-columns:repeat(3,1fr); padding:4px; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
.nav-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--mut); font-size:11px; font-weight:600; border-radius:99px; }
.nav-btn svg { width:20px; height:20px; }
.nav-btn.active { color:var(--acc); background:radial-gradient(circle at 50% 60%,rgba(255,255,255,0.16),transparent 70%); }
.fab-add { pointer-events:auto; width:62px; height:62px; border-radius:50%; background:rgba(15,15,18,0.92); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.22); color:var(--acc); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
.fab-add svg { width:26px; height:26px; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); backdrop-filter:blur(6px); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
.modal-sheet { width:100%; max-width:520px; max-height:92vh; background:#101013; border-top:1px solid var(--brd); border-radius:24px 24px 0 0; overflow-y:auto; padding:18px 16px 30px; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-title { font-size:18px; font-weight:800; }
.close-btn { width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--brd); display:flex; align-items:center; justify-content:center; }
.form-group { margin-bottom:14px; }
.form-label { display:block; font-size:12px; font-weight:700; color:var(--mut); margin-bottom:6px; }
.form-input, .form-textarea { width:100%; background:var(--card); border:1px solid var(--brd); border-radius:14px; padding:12px 14px; font-size:14px; outline:none; }
.form-textarea { min-height:86px; resize:vertical; }
.photo-upload-box { border:1px dashed var(--brd); background:var(--card); border-radius:14px; padding:14px; text-align:center; cursor:pointer; margin-bottom:10px; }
.preview-list { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.preview-item { position:relative; width:72px; height:72px; border-radius:10px; overflow:hidden; flex-shrink:0; border:1px solid var(--brd); }
.preview-item img { width:100%; height:100%; object-fit:cover; }
.preview-remove { position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,0.75); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; }
.btn-primary { width:100%; background:var(--acc); color:var(--acc-fg); font-weight:800; font-size:15px; padding:14px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
.btn-secondary { width:100%; background:var(--card); color:var(--txt); border:1px solid var(--brd); font-weight:700; font-size:14px; padding:12px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-danger { width:100%; background:rgba(255,69,58,0.14); color:var(--err); border:1px solid rgba(255,69,58,0.3); font-weight:700; font-size:14px; padding:12px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; }
.detail-gallery { position:relative; width:100%; aspect-ratio:1/1; border-radius:20px; overflow:hidden; background:#18181c; margin-bottom:14px; }
.detail-gallery img { width:100%; height:100%; object-fit:cover; }
.gallery-nav { position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,0.6); color:#fff; display:flex; align-items:center; justify-content:center; }
.gallery-nav.prev { left:10px; }
.gallery-nav.next { right:10px; }
.seller-strip { background:var(--card); border:1px solid var(--brd); border-radius:20px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin:14px 0; cursor:pointer; }
.seller-strip-left { display:flex; align-items:center; gap:10px; }
.seller-mini-ava { width:44px; height:44px; border-radius:50%; background:#222; overflow:hidden; display:flex; align-items:center; justify-content:center; font-weight:800; border:1px solid var(--brd); }
.seller-mini-ava img { width:100%; height:100%; object-fit:cover; }
.review-card { background:var(--card); border:1px solid var(--brd); border-radius:14px; padding:12px; margin-bottom:8px; }
.review-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:13px; font-weight:700; }
.stars-select { display:flex; gap:6px; margin-bottom:10px; }
.star-btn { font-size:24px; color:#3a3a42; }
.star-btn.active { color:#fff; }
.empty-state { text-align:center; padding:40px 20px; color:var(--mut); font-size:14px; }
</style>
</head>
<body>
<section id="tab-feed" class="container">
  <div class="top-header">
    <div>
      <div class="greeting-sub"><span id="greeting-text">Привет</span><span id="user-admin-tag" class="admin-badge hidden">ADMIN</span></div>
      <h1 class="greeting-title">Что ищем сегодня?</h1>
    </div>
    <button class="city-pill" onclick="openCityModal()"><i data-lucide="map-pin"></i><span id="current-city-label">Уфа</span></button>
  </div>
  <div class="search-row">
    <div class="search-box"><i data-lucide="search"></i><input type="text" id="search-input" placeholder="Поиск по объявлениям..." oninput="renderFeed()"></div>
    <button class="filter-btn" onclick="cycleSortOrder()"><i data-lucide="sliders-horizontal"></i></button>
  </div>
  <div class="quick-actions">
    <button class="qa-card primary" onclick="openListingModal()"><i data-lucide="plus"></i><span>Продать</span></button>
    <button class="qa-card" onclick="openMyReviewsModal()"><i data-lucide="star"></i><span>Отзывы</span></button>
    <button class="qa-card" onclick="toggleFavoritesFilter()"><i data-lucide="heart"></i><span>Избранное</span></button>
    <button class="qa-card" onclick="openSellerCheckModal()"><i data-lucide="user-check"></i><span>Продавец</span></button>
  </div>
  <div class="promo-grid">
    <button class="promo-card white" onclick="setFeedMode('all')">
      <div class="promo-top"><i data-lucide="zap" style="width:18px;height:18px;"></i><div class="promo-arrow"><i data-lucide="arrow-right"></i></div></div>
      <div><div class="promo-title">Листать новое</div><div class="promo-sub" id="stat-total-count">0 объявлений</div></div>
    </button>
    <button class="promo-card dark" onclick="setFeedMode('nearby')">
      <div class="radar-dots"><span class="radar-dot-main"></span><span class="radar-dot-sm" style="right:4px;top:4px;"></span><span class="radar-dot-sm" style="right:10px;bottom:4px;"></span><span class="radar-dot-sm" style="left:22px;top:2px;"></span></div>
      <div style="margin-top:auto;"><div class="promo-title">Рядом</div><div class="promo-sub" id="stat-city-count">0 в городе</div></div>
    </button>
  </div>
  <div id="active-filter-bar" class="hidden" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--mut);">
    <span id="active-filter-text">Фильтр</span><button onclick="resetFilters()" style="color:#fff;font-weight:700;">Сбросить ×</button>
  </div>
  <div id="feed-grid" class="listings-grid"></div>
</section>

<section id="tab-mylots" class="container hidden">
  <h1 class="page-title">Мои лоты</h1>
  <div class="page-subtitle" id="mylots-subtitle">0 в ленте · 0 лотов всего</div>
  <div class="pills-row">
    <button id="mylots-tab-own" class="pill-tab active" onclick="switchMyLotsMode('own')">Мои <span id="count-own-lots">0</span></button>
    <button id="mylots-tab-admin" class="pill-tab hidden" onclick="switchMyLotsMode('all_admin')">Все лоты (Админ) <span id="count-all-lots">0</span></button>
  </div>
  <div class="bump-info-box">
    <div class="bump-icon"><i data-lucide="arrow-up"></i></div>
    <div><div style="font-size:14px;font-weight:800;">Управление объявлениями</div><div style="font-size:12px;color:var(--mut);margin-top:2px;">Жми «Поднять», «Изменить» или «Удалить» на карточке лота</div></div>
  </div>
  <div id="mylots-list"></div>
</section>

<section id="tab-profile" class="container hidden">
  <div class="profile-hero">
    <div class="profile-avatar" id="prof-avatar">U</div>
    <div class="profile-name" id="prof-name">Пользователь</div>
    <div class="profile-since" id="prof-id-label">Telegram ID: —</div>
    <div class="profile-badges">
      <button class="p-badge" onclick="openMyReviewsModal()"><span class="rate-highlight" id="prof-rate-percent">100%</span><span id="prof-rate-count">довольны · 0 оценок</span></button>
      <div class="p-badge" id="prof-lots-badge">0 лотов всего</div>
      <button class="p-badge" onclick="openCityModal()"><i data-lucide="map-pin" style="width:13px;height:13px;"></i><span id="prof-city-badge">Уфа</span></button>
    </div>
  </div>
  <div class="menu-group">
    <button class="menu-item" onclick="showFavoritesFromProfile()"><div class="menu-item-left"><div class="menu-icon"><i data-lucide="heart"></i></div><div><div class="menu-title">Избранное</div><div class="menu-sub">Сохранённые объявления</div></div></div><i data-lucide="chevron-right" class="menu-chevron"></i></button>
    <button class="menu-item" onclick="openSellerShowcase(currentUser.tg_id)"><div class="menu-item-left"><div class="menu-icon"><i data-lucide="layout-grid"></i></div><div><div class="menu-title">Моя витрина и отзывы</div><div class="menu-sub">Как тебя видят покупатели</div></div></div><i data-lucide="chev
