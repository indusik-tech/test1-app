<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resale Platform</title>
  
  <!-- Telegram Web App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #0a0a0a; --card: #1a1a1c; --border: #262626;
      --accent: #facc15; --text: #ffffff; --muted: #a3a3a3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: sans-serif; -webkit-tap-highlight-color: transparent;
      user-select: none; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .hide-scrollbar { overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    .tab-content { display: none; padding: 16px; padding-bottom: 90px; }
    .tab-content.active { display: block; }
    .text-yellow { color: var(--accent); }
    .bg-card { background-color: var(--card); border: 1px solid var(--border); }
    
    .nav-bar {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background-color: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; padding: 12px 24px; z-index: 40;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 500; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }
    .fab-btn {
      position: absolute; right: 16px; top: -24px; width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #000; border: none; font-size: 24px; display: flex;
      align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(250, 204, 21, 0.2);
    }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 50; display: none; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s ease;
    }
    .modal.show { display: flex; transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); align-items: center;}
    .input-field {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; outline: none;
    }
    .btn-primary {
      width: 100%; background: var(--accent); color: #000; border: none;
      padding: 16px; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer;}
  </style>
</head>
<body>

  <!-- Основная область -->
  <div class="hide-scrollbar" style="flex: 1;" id="main-scroll">
    
    <!-- Вкладка Лента -->
    <div id="tab-feed" class="tab-content active">
      <div style="margin-bottom: 20px;">
        <p style="color: var(--muted); font-size: 14px;" id="welcome-text">Добрый день!</p>
        <h1 style="font-size: 24px; font-weight: bold; margin-top: 4px;">Что ищем сегодня?</h1>
      </div>
      <input type="text" placeholder="Поиск по объявлениям..." class="input-field" style="margin-bottom: 20px;">
      <div id="feed-items" class="grid-2"></div>
    </div>

    <!-- Вкладка Мои Лоты -->
    <div id="tab-mylots" class="tab-content">
      <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 16px;">Мои лоты</h1>
      <p id="mylots-count" style="color: var(--muted); font-size: 12px; margin-bottom: 16px;">Загрузка...</p>
      <div id="mylots-items" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

    <!-- Вкладка Профиль -->
    <div id="tab-profile" class="tab-content">
      <div style="text-align: center; padding-top: 20px;">
        <div style="width: 80px; height: 80px; background: #262626; border-radius: 50%; margin: 0 auto 12px; overflow: hidden;">
          <img id="profile-avatar" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400&q=80" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <h1 id="profile-name" style="font-size: 20px; font-weight: bold;">Пользователь</h1>
        <p style="color: var(--muted); font-size: 12px;">Синхронизировано с Telegram</p>
      </div>
      
      <div class="bg-card" style="margin-top: 30px; border-radius: 20px; padding: 16px;">
        <p style="font-size: 14px; margin-bottom: 8px;">📊 Статистика</p>
        <p id="profile-stats" class="text-yellow" style="font-size: 20px; font-weight: bold;">0 лотов</p>
      </div>
    </div>
  </div>

  <!-- Навигация -->
  <div class="nav-bar pb-safe">
    <button class="nav-btn active" id="btn-feed" onclick="switchTab('feed')">
      <div style="font-size: 20px;">🏠</div> Лента
    </button>
    <button class="nav-btn" id="btn-mylots" onclick="switchTab('mylots')">
      <div style="font-size: 20px;">📦</div> Мои лоты
    </button>
    <button class="nav-btn" id="btn-profile" onclick="switchTab('profile')" style="margin-right: 32px;">
      <div style="font-size: 20px;">👤</div> Профиль
    </button>
    <button class="fab-btn" onclick="openModal('add-modal')">➕</button>
  </div>

  <!-- Модалка Добавления / Редактирования -->
  <div id="add-modal" class="modal">
    <div class="modal-header">
      <button onclick="closeModals()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
      <h2 id="modal-form-title" style="font-size: 16px; font-weight: bold;">Новое объявление</h2>
      <div style="width: 20px;"></div>
    </div>
    <div style="flex: 1; padding: 16px; overflow-y:auto;">
      <input type="hidden" id="edit-id" value="">
      <input type="text" id="add-title" class="input-field" placeholder="Название вещи">
      <input type="number" id="add-price" class="input-field" placeholder="Цена (₽)">
      <input type="text" id="add-location" class="input-field" placeholder="Город">
      <input type="text" id="add-image" class="input-field" placeholder="Ссылка на фото (URL)">
      <textarea id="add-desc" class="input-field" placeholder="Описание, состояние, размер..." rows="4"></textarea>
    </div>
    <div style="padding: 16px;" class="pb-safe">
      <button class="btn-primary" onclick="saveItem()" id="save-btn">Опубликовать</button>
    </div>
  </div>

  <!-- Модалка Просмотра Товара -->
  <div id="item-modal" class="modal" style="z-index: 60;">
    <div style="position: relative; height: 40%; background: #262626;">
      <img id="detail-img" src="" style="width: 100%; height: 100%; object-fit: cover;">
      <button onclick="closeModals()" style="position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.5); border:none; color:white; border-radius:50%; width:32px; height:32px; font-size:16px;">✕</button>
    </div>
    <div style="flex: 1; padding: 16px; overflow-y: auto;">
      <h1 id="detail-title" style="font-size: 20px; font-weight: bold;"></h1>
      <p id="detail-price" class="text-yellow font-bold" style="font-size: 24px; margin-top: 4px;"></p>
      
      <div style="display:flex; justify-content: space-between; margin-top: 12px; color: var(--muted); font-size: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);">
        <span id="detail-location">📍 Город</span>
        <span id="detail-seller">👤 Продавец</span>
      </div>
      <p id="detail-desc" style="color: var(--muted); font-size: 14px; margin-top: 16px; line-height: 1.5;"></p>
    </div>
    <div class="pb-safe" style="padding: 16px; background: var(--bg);" id="detail-action-container">
      <!-- Кнопка появится тут через JS (Написать или Редактировать) -->
    </div>
  </div>

  <script>
    // ==========================================
    // ВСТАВЬ СВОИ КЛЮЧИ ИЗ SUPABASE СЮДА:
    // ==========================================
    const SUPABASE_URL = 'ТВОЙ_PROJECT_URL';
    const SUPABASE_KEY = 'ТВОЙ_ANON_PUBLIC_KEY';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Данные пользователя Telegram
    let tgUser = { id: 123456789, first_name: "Тестовый Юзер", photo_url: "" }; // Заглушка для ПК
    
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor('#0a0a0a');
      
      if (window.Telegram.WebApp.initDataUnsafe?.user) {
        tgUser = window.Telegram.WebApp.initDataUnsafe.user;
      }
    }

    // Синхронизация профиля
    document.getElementById('welcome-text').innerText = `Добрый день, ${tgUser.first_name}!`;
    document.getElementById('profile-name').innerText = tgUser.first_name;
    if (tgUser.photo_url) {
      document.getElementById('profile-avatar').src = tgUser.photo_url;
    }

    let items = []; // Локальный массив для отрисовки

    // Загрузка товаров из базы
    async function fetchItems() {
      const { data, error } = await supabase
        .from('items')
        .select('*')
        .eq('status', 'active')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Ошибка загрузки:', error);
        return;
      }
      
      items = data || [];
      renderFeed();
      renderMyLots();
    }

    function renderFeed() {
      const container = document.getElementById('feed-items');
      container.innerHTML = items.map(item => `
        <div class="item-card" onclick="openItem(${item.id})">
          <div style="width:100%; aspect-ratio:4/5; background:#262626;">
            <img src="${item.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80'}" style="width:100%; height:100%; object-fit:cover;">
          </div>
          <div style="padding: 12px;">
            <p class="text-yellow font-bold">${item.price.toLocaleString()} ₽</p>
            <p style="font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.title}</p>
            <p style="font-size: 10px; color: var(--muted); margin-top: 4px;">📍 ${item.location || 'Уфа'}</p>
          </div>
        </div>
      `).join('');
    }

    function renderMyLots() {
      const myItems = items.filter(i => Number(i.user_id) === tgUser.id);
      document.getElementById('mylots-count').innerText = `${myItems.length} лотов активно`;
      document.getElementById('profile-stats').innerText = `${myItems.length} лотов`;
      
      const container = document.getElementById('mylots-items');
      container.innerHTML = myItems.map(item => `
        <div class="bg-card" style="border-radius:16px; padding:16px; cursor:pointer;" onclick="openItem(${item.id})">
          <h3 style="font-size: 14px; font-weight: 500;">${item.title}</h3>
          <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:4px;">
            <p class="text-yellow font-bold" style="font-size: 18px;">${item.price.toLocaleString()} ₽</p>
            <button onclick="event.stopPropagation(); startEdit(${item.id})" style="background:var(--border); color:white; border:none; padding:6px 12px; border-radius:8px; font-size:12px;">Редактировать</button>
          </div>
        </div>
      `).join('');
    }

    // Сохранение (Создание или Обновление)
    async function saveItem() {
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('add-title').value;
      const price = document.getElementById('add-price').value;
      const desc = document.getElementById('add-desc').value;
      const loc = document.getElementById('add-location').value;
      const img = document.getElementById('add-image').value;

      if (!title || !price) {
        window.Telegram.WebApp.showAlert('Введите название и цену!');
        return;
      }

      document.getElementById('save-btn').innerText = 'Сохранение...';

      const itemData = {
        user_id: tgUser.id,
        user_name: tgUser.first_name,
        title: title,
        price: parseInt(price),
        description: desc,
        location: loc || 'Уфа',
        image: img || 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400&q=80',
        status: 'active'
      };

      if (id) {
        // Обновляем существующий лот
        await supabase.from('items').update(itemData).eq('id', id);
      } else {
        // Создаем новый
        await supabase.from('items').insert([itemData]);
      }

      closeModals();
      await fetchItems(); // Перезапрашиваем базу
    }

    // Подготовка формы для редактирования
    function startEdit(id) {
      const item = items.find(i => i.id === id);
      document.getElementById('modal-form-title').innerText = 'Редактировать лот';
      document.getElementById('edit-id').value = item.id;
      document.getElementById('add-title').value = item.title;
      document.getElementById('add-price').value = item.price;
      document.getElementById('add-desc').value = item.description || '';
      document.getElementById('add-location').value = item.location || '';
      document.getElementById('add-image').value = item.image || '';
      document.getElementById('save-btn').innerText = 'Сохранить изменения';
      openModal('add-modal');
    }

    // Просмотр товара
    function openItem(id) {
      const item = items.find(i => i.id === id);
      const isMine = Number(item.user_id) === tgUser.id;

      document.getElementById('detail-img').src = item.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80';
      document.getElementById('detail-title').innerText = item.title;
      document.getElementById('detail-price').innerText = item.price.toLocaleString() + ' ₽';
      document.getElementById('detail-desc').innerText = item.description || 'Нет описания';
      document.getElementById('detail-location').innerText = '📍 ' + (item.location || 'Уфа');
      document.getElementById('detail-seller').innerText = '👤 ' + (item.user_name || 'Продавец');

      const actionContainer = document.getElementById('detail-action-container');
      if (isMine) {
        actionContainer.innerHTML = `<button onclick="closeModals(); startEdit(${item.id})" style="width:100%; background:var(--border); color:white; border:none; padding:16px; border-radius:16px; font-weight:bold;">Редактировать свой лот</button>`;
      } else {
        actionContainer.innerHTML = `<button class="btn-primary">Написать продавцу</button>`;
      }
      
      openModal('item-modal');
    }

    // Утилиты UI
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('btn-' + tabId).classList.add('active');
    }

    function openModal(id) {
      if(id === 'add-modal' && !document.getElementById('edit-id').value) {
        // Очищаем форму если это создание нового
        document.getElementById('modal-form-title').innerText = 'Новое объявление';
        document.getElementById('edit-id').value = '';
        document.getElementById('add-title').value = '';
        document.getElementById('add-price').value = '';
        document.getElementById('add-desc').value = '';
        document.getElementById('add-location').value = '';
        document.getElementById('add-image').value = '';
        document.getElementById('save-btn').innerText = 'Опубликовать';
      }
      document.getElementById(id).classList.add('show');
    }

    function closeModals() { 
      document.querySelectorAll('.modal').forEach(el => el.classList.remove('show'));
      document.getElementById('edit-id').value = ''; // Сброс ID
    }

    // Запуск при старте
    fetchItems();
  </script>
</body>
</html>
